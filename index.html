<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestLog</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%23151C2C' stroke='%236366F1' stroke-opacity='0.45' stroke-width='1.5'/%3E%3Cg transform='translate(4,4)' fill='none' stroke='%23818CF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='14.5 17.5 3 6 3 3 6 3 17.5 14.5'/%3E%3Cline x1='13' x2='19' y1='19' y2='13'/%3E%3Cline x1='16' x2='20' y1='16' y2='20'/%3E%3Cline x1='19' x2='21' y1='21' y2='19'/%3E%3Cpolyline points='14.5 6.5 18 3 21 3 21 6 17.5 9.5'/%3E%3Cline x1='5' x2='14' y1='14' y2='5'/%3E%3Cline x1='7' x2='17' y1='17' y2='7'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS SDK v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0B0F17',
                        cardBg: '#151C2C',
                        cardBorder: '#1E293B',
                        accent: '#6366F1'
                    }
                }
            }
        };
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: #0B0F17;
            color: #F8FAFC;
        }

        /* Custom Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366F1;
        }

        /* Custom Rounded Dropdown Menus */
        .custom-select-menu {
            scrollbar-width: thin;
            scrollbar-color: #1E293B #0F172A;
        }
        .custom-select-menu::-webkit-scrollbar {
            width: 5px;
        }
        .custom-select-menu::-webkit-scrollbar-track {
            background: #0F172A;
            border-radius: 9999px;
        }
        .custom-select-menu::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 9999px;
        }
        .custom-select-menu::-webkit-scrollbar-thumb:hover {
            background: #6366F1;
        }

        /* Color Swatch Wrapper */
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.75rem;
        }

        /* Deadline Glow Animations */
        @keyframes overdueGlow {
            0%, 100% { border-color: rgba(244, 63, 94, 0.4); box-shadow: 0 0 10px rgba(244, 63, 94, 0.15); }
            50% { border-color: rgba(244, 63, 94, 0.9); box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
        }

        @keyframes closeDeadlineGlow {
            0%, 100% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 10px rgba(245, 158, 11, 0.15); }
            50% { border-color: rgba(245, 158, 11, 0.9); box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
        }

        /* Subtle yellow glow 1 day before deadline */
        @keyframes closeDeadlineGlowDayBefore {
            0%, 100% { border-color: rgba(245, 158, 11, 0.2); box-shadow: 0 0 6px rgba(245, 158, 11, 0.06); }
            50% { border-color: rgba(245, 158, 11, 0.48); box-shadow: 0 0 12px rgba(245, 158, 11, 0.16); }
        }

        /* Barely noticeable yellow glow 2 days before deadline */
        @keyframes closeDeadlineGlowTwoDaysBefore {
            0%, 100% { border-color: rgba(245, 158, 11, 0.08); box-shadow: 0 0 2px rgba(245, 158, 11, 0.02); }
            50% { border-color: rgba(245, 158, 11, 0.22); box-shadow: 0 0 6px rgba(245, 158, 11, 0.07); }
        }

        /* XP Badge Green & Red Flash Animations */
        @keyframes greenGlow {
            0%, 100% {
                box-shadow: 0 0 0px rgba(34, 197, 94, 0);
            }
            40% {
                box-shadow: 0 0 24px rgba(34, 197, 94, 0.65);
                border-color: rgba(34, 197, 94, 0.7);
                background-color: rgba(34, 197, 94, 0.14);
            }
        }

        @keyframes redGlow {
            0%, 100% {
                box-shadow: 0 0 0px rgba(244, 63, 94, 0);
            }
            40% {
                box-shadow: 0 0 24px rgba(244, 63, 94, 0.65);
                border-color: rgba(244, 63, 94, 0.7);
                background-color: rgba(244, 63, 94, 0.14);
            }
        }

        @keyframes greenTextFlash {
            0%, 100% { color: #e0e7ff; }
            35%, 65% { color: #4ade80; }
        }

        @keyframes greenIconFlash {
            0%, 100% {
                color: #818cf8;
                fill: rgba(129, 140, 248, 0.25);
            }
            35%, 65% {
                color: #4ade80;
                fill: rgba(74, 222, 128, 0.32);
            }
        }

        @keyframes redTextFlash {
            0%, 100% { color: #e0e7ff; }
            35%, 65% { color: #fb7185; }
        }

        @keyframes redIconFlash {
            0%, 100% {
                color: #818cf8;
                fill: rgba(129, 140, 248, 0.25);
            }
            35%, 65% {
                color: #fb7185;
                fill: rgba(251, 113, 133, 0.32);
            }
        }

        @keyframes redShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .task-overdue {
            animation: overdueGlow 2.2s infinite ease-in-out;
        }

        .task-close-deadline {
            animation: closeDeadlineGlow 2.2s infinite ease-in-out;
        }

        .task-close-deadline-1 {
            animation: closeDeadlineGlowDayBefore 2.4s infinite ease-in-out;
        }

        .task-close-deadline-2 {
            animation: closeDeadlineGlowTwoDaysBefore 2.6s infinite ease-in-out;
        }

        .animate-green-glow {
            animation: greenGlow 0.55s ease-in-out;
        }

        .animate-green-glow #userXp {
            animation: greenTextFlash 0.55s ease-in-out;
        }

        .animate-green-glow svg {
            animation: greenIconFlash 0.55s ease-in-out;
        }

        .animate-red-shake {
            animation: redShake 0.4s ease-in-out;
        }

        .animate-red-glow-shake {
            animation: redGlow 0.55s ease-in-out, redShake 0.4s ease-in-out;
        }

        .animate-red-glow-shake #userXp {
            animation: redTextFlash 0.55s ease-in-out;
        }

        .animate-red-glow-shake svg {
            animation: redIconFlash 0.55s ease-in-out;
        }

        /* Exponential-like smooth progress bar fill (fast start, gradual slowdown) */
        .subtask-progress-fill {
            transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease;
        }

        /* Task Completion Green Flash (0.5s or 0.9s before gliding down) */
        @keyframes taskCompleteFlash {
            0% {
                border-color: rgba(16, 185, 129, 0.95);
                box-shadow: 0 0 26px rgba(16, 185, 129, 0.55);
                background-color: rgba(16, 185, 129, 0.14);
            }
            55% {
                border-color: rgba(52, 211, 153, 1);
                box-shadow: 0 0 34px rgba(16, 185, 129, 0.65);
                background-color: rgba(16, 185, 129, 0.18);
            }
            100% {
                border-color: rgba(16, 185, 129, 0.55);
                box-shadow: 0 0 14px rgba(16, 185, 129, 0.22);
                background-color: #151C2C;
            }
        }

        .task-complete-flash {
            animation: taskCompleteFlash 0.5s ease-out forwards;
        }

        .task-complete-flash-long {
            animation: taskCompleteFlash 0.9s ease-out forwards;
        }

        /* Task Uncomplete Subtle Wake-up Pulse */
        @keyframes taskUncompletePulse {
            0% {
                border-color: rgba(99, 102, 241, 0.85);
                box-shadow: 0 0 22px rgba(99, 102, 241, 0.4);
            }
            100% {
                border-color: rgba(30, 41, 59, 0.8);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
        }

        .task-uncomplete-pulse {
            animation: taskUncompletePulse 0.65s ease-out;
        }

        /* Task Creation Smooth Entrance */
        @keyframes taskEnterAnim {
            0% {
                opacity: 0;
                transform: translateY(-14px) scale(0.96);
                border-color: rgba(99, 102, 241, 0.85);
                box-shadow: 0 0 26px rgba(99, 102, 241, 0.45);
            }
            70% {
                opacity: 1;
                transform: translateY(2px) scale(1.005);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .task-enter-anim {
            animation: taskEnterAnim 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Task Deletion Smooth Exit */
        .task-exit-anim {
            animation: none !important;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
            opacity: 0 !important;
            transform: translateX(24px) scale(0.95) !important;
            border-color: rgba(244, 63, 94, 0.85) !important;
            pointer-events: none;
        }

        /* Category & Color Item Entrance / Exit Animations */
        @keyframes itemEnterAnim {
            0% {
                opacity: 0;
                transform: translateY(-6px) scale(0.92);
                border-color: rgba(99, 102, 241, 0.85);
                box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .item-enter-anim {
            animation: itemEnterAnim 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .item-exit-anim {
            animation: none !important;
            transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1), transform 0.26s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
            opacity: 0 !important;
            transform: scale(0.88) translateX(10px) !important;
            border-color: rgba(244, 63, 94, 0.85) !important;
            pointer-events: none;
        }

        /* Locked / Blurred Background State Before Login */
        #mainContent {
            transition: filter 0.35s ease, opacity 0.35s ease;
        }

        #mainContent.app-locked {
            filter: blur(5px);
            opacity: 0.55;
            pointer-events: none;
            user-select: none;
        }

        @keyframes authCardAppear {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-card-anim {
            animation: authCardAppear 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-[#0B0F17] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white pb-16">

    <!-- MAIN CONTAINER -->
    <div id="mainContent" class="max-w-5xl mx-auto px-4 py-8 space-y-6 app-locked">
        
        <!-- HEADER WITH XP BADGE & USER ACCOUNT -->
        <header class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-2xl backdrop-blur-md flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3.5">
                <div class="p-3 bg-gradient-to-br from-indigo-500/20 to-violet-500/10 text-indigo-400 rounded-2xl border border-indigo-500/30 shadow-lg shadow-indigo-500/10">
                    <i data-lucide="swords" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        QuestLog
                    </h1>
                </div>
            </div>

            <!-- RIGHT HEADER CONTROLS: XP & USER PROFILE -->
            <div class="flex items-center space-x-2.5 sm:space-x-3">
                <!-- XP STATS BADGE -->
                <div id="xpBadgeBox" class="flex items-center space-x-2 px-3.5 sm:px-4 py-2 bg-indigo-500/[0.07] border border-indigo-400/15 rounded-xl text-slate-200 font-extrabold text-xs shadow-md transition-transform duration-200 transform hover:scale-105 hover:border-indigo-400/30">
                    <i data-lucide="zap" class="w-4 h-4 text-indigo-400 fill-indigo-400/25"></i>
                    <span id="userXp" class="text-sm tracking-tight text-indigo-100">0</span>
                </div>

                <!-- LOGGED-IN USER PILL + LOGOUT BUTTON -->
                <div id="userAccountBox" class="flex items-center bg-[#0B0F17]/90 border border-slate-800 rounded-xl pl-3 pr-1.5 py-1.5 shadow-md space-x-2">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 rounded-lg bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                            <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        </div>
                        <span id="currentUsernameDisplay" class="text-xs font-bold text-slate-200 max-w-[100px] truncate">Hráč</span>
                    </div>
                    <div class="h-4 w-px bg-slate-800"></div>
                    <button type="button" onclick="window.logoutUser()" title="Odhlásit se"
                        class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition flex items-center justify-center">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- CREATION PANEL (3 TABS) -->
        <section class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-5">
            <!-- Tabs Header -->
            <div class="flex space-x-2 border-b border-slate-800/80 pb-3">
                <button type="button" id="tabQuestBtn" onclick="window.switchCreationTab('quest')" class="flex items-center space-x-2 px-4 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition">
                    <i data-lucide="scroll" class="w-4 h-4"></i>
                    <span>Nový úkol</span>
                </button>
                <button type="button" id="tabCategoryBtn" onclick="window.switchCreationTab('category')" class="flex items-center space-x-2 px-4 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
                    <i data-lucide="tag" class="w-4 h-4"></i>
                    <span>Nová kategorie</span>
                </button>
                <button type="button" id="tabColorBtn" onclick="window.switchCreationTab('color')" class="flex items-center space-x-2 px-4 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
                    <i data-lucide="palette" class="w-4 h-4"></i>
                    <span>Nová barva</span>
                </button>
            </div>

            <!-- TAB 1: NOVÝ ÚKOL -->
            <div id="tabQuestContent" class="space-y-4">
                <form id="createQuestForm" onsubmit="window.createNewTask(event)" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <!-- Task Title (Span 2) -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Název úkolu</label>
                            <input type="text" id="taskTitle" required placeholder="Co je potřeba udělat?" oninput="window.clearInputError('taskTitle')" class="w-full bg-[#0B0F17] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                        </div>

                        <!-- Category Selection (Col 3) -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Kategorie</label>
                            <div class="relative custom-select-wrapper" data-select-id="taskCategorySelect">
                                <input type="hidden" id="taskCategorySelect" value="Default">
                                <button type="button" onclick="window.toggleCustomSelect('taskCategorySelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-8 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center justify-between relative">
                                    <span id="taskCategorySelectLabel" class="truncate">Default</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2.5 pointer-events-none transition-transform duration-200" id="taskCategorySelectChevron"></i>
                                </button>
                                <div id="taskCategorySelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>
                        </div>

                        <!-- Urgency Selection (Col 4) -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Naléhavost</label>
                            <div class="relative custom-select-wrapper" data-select-id="taskUrgencySelect">
                                <input type="hidden" id="taskUrgencySelect" value="3">
                                <button type="button" onclick="window.toggleCustomSelect('taskUrgencySelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-8 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center justify-between relative">
                                    <span id="taskUrgencySelectLabel" class="truncate">★ 3 (Normální)</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2.5 pointer-events-none transition-transform duration-200" id="taskUrgencySelectChevron"></i>
                                </button>
                                <div id="taskUrgencySelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Date (Col 1-2, compact) and Color Swatches (Col 3-4) -->
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-start">
                        <!-- Date Selectors (Col 1-2 - Compact & left-aligned) -->
                        <div class="sm:col-span-2 flex items-center space-x-2">
                            <div class="w-[4.75rem] flex-shrink-0">
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Den</label>
                                <div class="relative custom-select-wrapper" data-select-id="taskDaySelect">
                                    <input type="hidden" id="taskDaySelect" value="1">
                                    <button type="button" onclick="window.toggleCustomSelect('taskDaySelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-7 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center relative">
                                        <span id="taskDaySelectLabel" class="truncate text-left">1.</span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2 pointer-events-none transition-transform duration-200" id="taskDaySelectChevron"></i>
                                    </button>
                                    <div id="taskDaySelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                        <!-- Populated dynamically -->
                                    </div>
                                </div>
                            </div>

                            <div class="w-[7.25rem] flex-shrink-0">
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Měsíc</label>
                                <div class="relative custom-select-wrapper" data-select-id="taskMonthSelect">
                                    <input type="hidden" id="taskMonthSelect" value="1">
                                    <button type="button" onclick="window.toggleCustomSelect('taskMonthSelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-7 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center relative">
                                        <span id="taskMonthSelectLabel" class="truncate text-left">Leden</span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2 pointer-events-none transition-transform duration-200" id="taskMonthSelectChevron"></i>
                                    </button>
                                    <div id="taskMonthSelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                        <!-- Populated dynamically -->
                                    </div>
                                </div>
                            </div>

                            <div class="w-[5.5rem] flex-shrink-0">
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Rok</label>
                                <div class="relative custom-select-wrapper" data-select-id="taskYearSelect">
                                    <input type="hidden" id="taskYearSelect" value="2026">
                                    <button type="button" onclick="window.toggleCustomSelect('taskYearSelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-7 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center relative">
                                        <span id="taskYearSelectLabel" class="truncate text-left">2026</span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2 pointer-events-none transition-transform duration-200" id="taskYearSelectChevron"></i>
                                    </button>
                                    <div id="taskYearSelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                        <!-- Populated dynamically -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Color Swatches (Col 3-4) -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Barva</label>
                            <div id="colorPaletteSelect" class="flex flex-wrap items-center gap-3 py-2 px-1.5">
                                <!-- Populated dynamically -->
                            </div>

    <script>
        // =============================================================
        // NASTAVENÍ SUPABASE (VLOŽ SVÉ ÚDAJE Z PROJECT SETTINGS -> DATA API / API KEYS)
        // =============================================================
        const SUPABASE_URL = "https://zgnwzwygkfaeazcbwmod.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YSFOer4K0aug13X_cAgjng_bgnaUX92";

        function isSupabaseConfigured() {
            return (
                typeof SUPABASE_URL === "string" &&
                SUPABASE_URL.startsWith("https://") &&
                !SUPABASE_URL.includes("VLOZ_SVOU") &&
                typeof SUPABASE_PUBLISHABLE_KEY === "string" &&
                SUPABASE_PUBLISHABLE_KEY.length > 20 &&
                !SUPABASE_PUBLISHABLE_KEY.includes("VLOZ_SVUJ")
            );
        }

        const supabaseClient = isSupabaseConfigured() && window.supabase
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
            : null;

        // -------------------------------------------------------------
        // GLOBAL STATE
        // -------------------------------------------------------------
        let currentUser = null;
        let currentUsername = "";

        let userXp = 0;
        let displayedUserXp = 0;
        let xpAnimationFrameId = null;
        let xpBadgeAnimTimeout = null;
        let dailyStreak = 0;

        let tasks = [];
        let categories = [];
        let colorPalette = [
            { name: "Bílá", hex: "#FFFFFF" }
        ];

        let selectedTaskColor = "#FFFFFF";
        let tempSubtasks = [];
        let editingTempSubtaskIndex = null;

        let currentEditTarget = null;
        let currentTargetTaskForColor = null;

        const COMPLETED_TASK_TTL_MS = 24 * 60 * 60 * 1000; // 1 day (24 hours)

        // -------------------------------------------------------------
        // SAFE ESCAPING, INTERNAL EMAIL & INPUT FEEDBACK HELPERS
        // -------------------------------------------------------------
        function usernameToInternalEmail(username) {
            const bytes = new TextEncoder().encode(username.trim().toLowerCase());
            const hex = Array.from(bytes)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
            return `u_${hex}@questlog.local`;
        }

        function normalizeAuthPassword(password) {
            return password.length < 6 ? `${password}__ql_pad` : password;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeJsString(str) {
            return String(str ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r');
        }

        function triggerInputError(inputOrId) {
            const el = typeof inputOrId === 'string' ? document.getElementById(inputOrId) : inputOrId;
            if (!el) return;
            el.classList.remove('animate-red-shake');
            void el.offsetWidth;
            el.classList.add('border-rose-500', 'animate-red-shake');
            setTimeout(() => {
                el.classList.remove('animate-red-shake');
            }, 450);
        }

        window.clearInputError = function(inputOrId) {
            const el = typeof inputOrId === 'string' ? document.getElementById(inputOrId) : inputOrId;
            if (!el) return;
            el.classList.remove('border-rose-500', 'animate-red-shake');
        };

        function formatIsoDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDisplayDate(isoStr) {
            if (!isoStr) return '';
            const parts = String(isoStr).split('-');
            if (parts.length !== 3) return isoStr;
            const [y, m, d] = parts;
            return `${parseInt(d, 10)}. ${parseInt(m, 10)}. ${y}`;
        }

        function getDeadlineStatus(dueDateStr) {
            if (!dueDateStr) return 'normal';
            const parts = String(dueDateStr).split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return 'normal';

            const now = new Date();
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const dueMidnight = new Date(parts[0], parts[1] - 1, parts[2]);
            const diffDays = Math.round((dueMidnight - todayMidnight) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return 'overdue';
            if (diffDays === 0) return 'today';
            if (diffDays === 1) return 'tomorrow';
            if (diffDays === 2) return 'two-days';
            return 'normal';
        }

        async function loadUserCloudData(user) {
            if (!supabaseClient || !user) return;
            currentUser = user;

            try {
                const [
                    { data: profile, error: profileErr },
                    { data: catRows, error: catErr },
                    { data: colorRows, error: colorErr },
                    { data: taskRows, error: taskErr },
                    { data: subtaskRows, error: subtaskErr }
                ] = await Promise.all([
                    supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle(),
                    supabaseClient.from('categories').select('*').eq('user_id', user.id).order('created_at', { ascending: true }),
                    supabaseClient.from('colors').select('*').eq('user_id', user.id).order('created_at', { ascending: true }),
                    supabaseClient.from('tasks').select('*').eq('user_id', user.id).order('created_at', { ascending: true }),
                    supabaseClient.from('subtasks').select('*').eq('user_id', user.id).order('position', { ascending: true }).order('created_at', { ascending: true })
                ]);

                if (profileErr) throw profileErr;
                if (catErr) throw catErr;
                if (colorErr) throw colorErr;
                if (taskErr) throw taskErr;
                if (subtaskErr) throw subtaskErr;

                const todayStr = formatIsoDate(new Date());
                currentUsername = profile?.username || user.user_metadata?.username || 'Hráč';
                userXp = Number(profile?.xp) || 0;

                if (profile?.last_streak_date === todayStr) {
                    dailyStreak = Number(profile?.daily_streak) || 0;
                } else {
                    dailyStreak = 0;
                    if (profile && Number(profile.daily_streak) !== 0) {
                        supabaseClient
                            .from('profiles')
                            .update({ daily_streak: 0 })
                            .eq('id', user.id)
                            .then(() => {});
                    }
                }

                categories = (catRows || []).map(r => r.name);

                const cloudColors = (colorRows || [])
                    .map(r => ({ name: r.name, hex: String(r.hex).toUpperCase() }))
                    .filter(c => !(c.hex === '#FFFFFF' && c.name.toLowerCase() === 'bílá'));

                colorPalette = [
                    { name: "Bílá", hex: "#FFFFFF" },
                    ...cloudColors
                ];
                selectedTaskColor = colorPalette[1]?.hex || "#FFFFFF";

                const subtasksByTask = {};
                (subtaskRows || []).forEach(st => {
                    if (!subtasksByTask[st.task_id]) subtasksByTask[st.task_id] = [];
                    subtasksByTask[st.task_id].push({
                        id: st.id,
                        title: st.title,
                        completed: Boolean(st.completed)
                    });
                });

                tasks = (taskRows || []).map(t => ({
                    id: t.id,
                    title: t.title,
                    category: t.category || 'Default',
                    urgency: Number(t.urgency) || 3,
                    dueDate: t.due_date,
                    color: t.color || '#FFFFFF',
                    completed: Boolean(t.completed),
                    completedAt: t.completed_at ? Number(t.completed_at) : null,
                    earnedXp: Number(t.earned_xp) || 0,
                    countedInStreak: Boolean(t.counted_in_streak),
                    subtasks: subtasksByTask[t.id] || []
                }));

                await cleanupExpiredCompletedTasks();

                document.getElementById('currentUsernameDisplay').textContent = currentUsername;
                renderCategoryDropdowns();
                renderColorPaletteSelector();
                renderCategoriesOverview();
                renderColorsOverview();
                updateXpDisplay(false);
                renderTasks();

                document.getElementById('mainContent').classList.remove('app-locked');
                document.getElementById('authModal').classList.add('hidden');
            } catch (err) {
                console.error('Chyba při načítání dat z databáze:', err);
                showToast('Nepodařilo se načíst data z cloudu.', 'warning', 'alert-triangle');
            }
        }

        async function syncProfileStatsToCloud() {
            if (!supabaseClient || !currentUser) return;
            const todayStr = formatIsoDate(new Date());
            const { error } = await supabaseClient
                .from('profiles')
                .update({
                    xp: userXp,
                    daily_streak: dailyStreak,
                    last_streak_date: dailyStreak > 0 ? todayStr : null
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Chyba při ukládání XP profilu:', error);
            }
        }

        async function cleanupExpiredCompletedTasks() {
            const now = Date.now();
            const expiredIds = [];
            tasks = tasks.filter(t => {
                if (t.completed && t.completedAt && (now - t.completedAt >= COMPLETED_TASK_TTL_MS)) {
                    expiredIds.push(t.id);
                    return false;
                }
                return true;
            });

            if (expiredIds.length > 0 && supabaseClient && currentUser) {
                const { error } = await supabaseClient
                    .from('tasks')
                    .delete()
                    .in('id', expiredIds)
                    .eq('user_id', currentUser.id);
                if (error) {
                    console.error('Chyba při mazání expirovaných úkolů:', error);
                }
            }
            return expiredIds.length > 0;
        }

        window.handleLogin = async function(e) {
            e.preventDefault();

            const loginErrorMsg = document.getElementById('loginErrorMsg');
            const loginErrorText = loginErrorMsg.querySelector('span');

                loginErrorText.textContent = 'Doplň nejprve SUPABASE_URL a SUPABASE_PUBLISHABLE_KEY v souboru index.html.';

                triggerInputError(usernameInput);
                return;
            }
            if (!password) {
                triggerInputError(passwordInput);
                return;
            }

            submitBtn.disabled = true;

            try {
                const internalEmail = usernameToInternalEmail(username);
                const { data, error } = await supabaseClient.auth.signInWithPassword({

                });

                if (error || !data?.user) {

                    loginErrorMsg.classList.remove('hidden');
                    triggerInputError(usernameInput);
                    triggerInputError(passwordInput);
                    lucide.createIcons();
                    return;
                }

                loginErrorMsg.classList.add('hidden');
                passwordInput.value = '';
                await loadUserCloudData(data.user);
                showToast(`Vítej zpět, ${currentUsername}!`, 'success', 'user');
            } catch (err) {
                loginErrorText.textContent = 'Chyba při komunikaci se serverem.';
                loginErrorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Přihlásit se';
            }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('regUsername');
            const passwordInput = document.getElementById('regPassword');
            const codeInput = document.getElementById('regInviteCode');
            const statusBox = document.getElementById('registerStatusMsg');
            const statusText = document.getElementById('registerStatusText');
            const submitBtn = document.getElementById('registerSubmitBtn');
            const submitText = document.getElementById('registerSubmitText');

            if (!supabaseClient) {
                statusText.textContent = 'Doplň nejprve SUPABASE_URL a SUPABASE_PUBLISHABLE_KEY v souboru index.html.';
                statusBox.classList.remove('hidden');
                return;
            }

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const inviteCode = codeInput.value.trim();

            if (!username) {
                triggerInputError(usernameInput);
                statusText.textContent = 'Zadej prosím přihlašovací jméno.';
                statusBox.classList.remove('hidden');
                return;
            }
            if (!password) {
                triggerInputError(passwordInput);
                statusText.textContent = 'Zadej prosím heslo.';
                statusBox.classList.remove('hidden');
                return;
            }
            if (!inviteCode) {
                triggerInputError(codeInput);
                statusText.textContent = 'Pro registraci je nutné zadat speciální zvací kód.';
                statusBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitText.textContent = 'Vytvářím účet...';

            try {
                const { data: fnData, error: fnError } = await supabaseClient.functions.invoke('register-user', {
                    body: { username, password, inviteCode }
                });

                if (fnError || fnData?.error) {
                    let errMessage = fnData?.error || fnData?.message || '';
                    let httpStatus = null;

                    if (!errMessage && fnError && fnError.context) {
                        httpStatus = fnError.context.status || null;
                        try {
                            const rawText = await fnError.context.text();
                            if (rawText) {
                                try {
                                    const errBody = JSON.parse(rawText);
                                    errMessage = errBody?.error || errBody?.message || errBody?.msg || rawText;
                                } catch (_) {
                                    errMessage = rawText;
                                }
                            }
                        } catch (_) {}
                    }

                    if (!errMessage && fnError?.message) {
                        errMessage = fnError.message;
                    }

                    if (httpStatus === 401 || String(errMessage).toLowerCase().includes('invalid jwt')) {
                        errMessage = 'Chyba 401 (Invalid JWT): V Supabase u funkce "register-user" vypni volbu Enforce JWT Verification (Details -> Enforce JWT Verification -> vypnout a uložit).';
                    } else if (httpStatus === 404) {
                        errMessage = 'Chyba 404: Funkce "register-user" nebyla v Supabase nalezena. Zkontroluj její přesný název.';
                    } else if (!errMessage) {
                        errMessage = 'Registrace se nezdařila.';
                    }

                    statusText.textContent = errMessage;
                    statusBox.classList.remove('hidden');
                    if (errMessage.toLowerCase().includes('kód')) {
                        triggerInputError(codeInput);
                    } else if (errMessage.toLowerCase().includes('jméno')) {
                        triggerInputError(usernameInput);
                    } else if (errMessage.toLowerCase().includes('hesl') || errMessage.toLowerCase().includes('password')) {
                        triggerInputError(passwordInput);
                    }
                    lucide.createIcons();
                    return;
                }

                // Automatically log in newly created account
                const internalEmail = usernameToInternalEmail(username);
                const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: internalEmail,
                    password: normalizeAuthPassword(password)
                });

                if (signInError || !signInData?.user) {
                    window.switchAuthMode('login');
                    document.getElementById('loginUsername').value = username;
                    showToast('Účet byl vytvořen! Nyní se přihlas.', 'success', 'check-circle');
                    return;
                }

                usernameInput.value = '';
                passwordInput.value = '';
                codeInput.value = '';
                statusBox.classList.add('hidden');

                await loadUserCloudData(signInData.user);
                showToast(`Účet ${currentUsername} byl úspěšně vytvořen!`, 'success', 'sparkles');
            } catch (err) {
                statusText.textContent = 'Neočekávaná chyba při komunikaci se serverem.';
                statusBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Vytvořit účet';
            }
        };

            for (let d = 1; d <= daysInMonth; d++) {

        // -------------------------------------------------------------
        // XP CALCULATION & ANIMATION
        // -------------------------------------------------------------
        function calculateTaskXp(task) {
            const urgencyWeights = { 1: 10, 2: 20, 3: 35, 4: 55, 5: 80 };
            const base = urgencyWeights[task.urgency] || 35;
            const subtaskBonus = (task.subtasks?.length || 0) * 10;
            const streakMultiplier = 1 + Math.min(dailyStreak, 10) * 0.1;
            return Math.round((base + subtaskBonus) * streakMultiplier);
        }

        function updateXpDisplay(animate = true, delta = 0) {
            const xpEl = document.getElementById('userXp');
            const badgeBox = document.getElementById('xpBadgeBox');
            if (!xpEl) return;

            if (!animate) {
                displayedUserXp = userXp;
                xpEl.textContent = String(userXp);
                return;
            }

            if (badgeBox && delta !== 0) {
                clearTimeout(xpBadgeAnimTimeout);
                badgeBox.classList.remove('animate-green-glow', 'animate-red-glow-shake');
                void badgeBox.offsetWidth;
                badgeBox.classList.add(delta > 0 ? 'animate-green-glow' : 'animate-red-glow-shake');
                xpBadgeAnimTimeout = setTimeout(() => {
                    badgeBox.classList.remove('animate-green-glow', 'animate-red-glow-shake');
                }, 600);
            }

            cancelAnimationFrame(xpAnimationFrameId);
            const startXp = displayedUserXp;
            const targetXp = userXp;
            const duration = 450;
            const startTime = performance.now();

            function step(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                displayedUserXp = Math.round(startXp + (targetXp - startXp) * eased);
                xpEl.textContent = String(displayedUserXp);
                if (progress < 1) {
                    xpAnimationFrameId = requestAnimationFrame(step);
                } else {
                    displayedUserXp = targetXp;
                    xpEl.textContent = String(targetXp);
                }
            }
            xpAnimationFrameId = requestAnimationFrame(step);
        }

        // -------------------------------------------------------------
        // TASK CRUD & INTERACTIONS
        // -------------------------------------------------------------
        window.createNewTask = async function(e) {
            e.preventDefault();
            const titleInput = document.getElementById('taskTitle');
            const title = titleInput.value.trim();
            if (!title) {
                triggerInputError(titleInput);
                return;
            }

            const category = document.getElementById('taskCategorySelect').value || 'Default';
            const urgency = parseInt(document.getElementById('taskUrgencySelect').value || '3', 10);
            const day = String(document.getElementById('taskDaySelect').value || '1').padStart(2, '0');
            const month = String(document.getElementById('taskMonthSelect').value || '1').padStart(2, '0');
            const year = String(document.getElementById('taskYearSelect').value || '2026');
            const dueDate = `${year}-${month}-${day}`;
            const color = selectedTaskColor || '#FFFFFF';

            const newTaskObj = {
                id: crypto.randomUUID ? crypto.randomUUID() : `task_${Date.now()}`,
                title,
                category,
                urgency,
                dueDate,
                color,
                completed: false,
                completedAt: null,
                earnedXp: 0,
                countedInStreak: false,
                subtasks: tempSubtasks.map(stTitle => ({
                    id: crypto.randomUUID ? crypto.randomUUID() : `sub_${Date.now()}_${Math.random()}`,
                    title: stTitle,
                    completed: false
                }))
            };

            tasks.unshift(newTaskObj);
            titleInput.value = '';
            tempSubtasks = [];
            editingTempSubtaskIndex = null;
            renderTempSubtasks();
            renderTasks(newTaskObj.id);
            showToast('Nový úkol byl přidán!', 'success', 'scroll');

            // Persist to Supabase
            if (supabaseClient && currentUser) {
                try {
                    const { data: insertedTask, error: taskError } = await supabaseClient
                        .from('tasks')
                        .insert({
                            id: newTaskObj.id,
                            user_id: currentUser.id,
                            title: newTaskObj.title,
                            category: newTaskObj.category,
                            urgency: newTaskObj.urgency,
                            due_date: newTaskObj.dueDate,
                            color: newTaskObj.color,
                            completed: false,
                            completed_at: null,
                            earned_xp: 0,
                            counted_in_streak: false
                        })
                        .select()
                        .single();

                    if (taskError) throw taskError;

                    if (insertedTask && newTaskObj.subtasks.length > 0) {
                        const subtaskPayload = newTaskObj.subtasks.map((st, idx) => ({
                            id: st.id,
                            task_id: insertedTask.id,
                            user_id: currentUser.id,
                            title: st.title,
                            completed: false,
                            position: idx
                        }));
                        const { error: stError } = await supabaseClient
                            .from('subtasks')
                            .insert(subtaskPayload);
                        if (stError) throw stError;
                    }
                } catch (err) {
                    console.error('Chyba při ukládání úkolu do databáze:', err);
                    showToast('Úkol se nepodařilo uložit do cloudu.', 'warning', 'alert-triangle');
                }
            }
        };

        window.toggleTaskComplete = async function(taskId, isFromAllSubtasks = false) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const cardEl = document.querySelector(`[data-task-id="${CSS.escape(taskId)}"]`);

            if (!task.completed) {
                const earned = calculateTaskXp(task);
                task.completed = true;
                task.completedAt = Date.now();
                task.earnedXp = earned;
                task.subtasks.forEach(st => { st.completed = true; });

                if (!task.countedInStreak) {
                    dailyStreak += 1;
                    task.countedInStreak = true;
                }

                userXp += earned;
                updateXpDisplay(true, earned);
                showToast(`Úkol splněn! +${earned} XP`, 'success', 'zap');

                if (cardEl) {
                    cardEl.classList.remove('task-overdue', 'task-close-deadline', 'task-close-deadline-1', 'task-close-deadline-2');
                    cardEl.classList.add(isFromAllSubtasks ? 'task-complete-flash-long' : 'task-complete-flash');
                }

                // Sync to Supabase
                if (supabaseClient && currentUser) {
                    Promise.all([
                        supabaseClient.from('tasks').update({
                            completed: true,
                            completed_at: task.completedAt,
                            earned_xp: task.earnedXp,
                            counted_in_streak: task.countedInStreak
                        }).eq('id', task.id).eq('user_id', currentUser.id),
                        task.subtasks.length > 0
                            ? supabaseClient.from('subtasks').update({ completed: true }).eq('task_id', task.id).eq('user_id', currentUser.id)
                            : Promise.resolve(),
                        syncProfileStatsToCloud()
                    ]).catch(err => console.error('Chyba při synchronizaci splnění úkolu:', err));
                }

                setTimeout(() => {
                    renderTasks();
                }, isFromAllSubtasks ? 880 : 480);
            } else {
                const lostXp = task.earnedXp || 0;
                task.completed = false;
                task.completedAt = null;
                task.earnedXp = 0;

                userXp = Math.max(0, userXp - lostXp);
                updateXpDisplay(true, -lostXp);
                showToast(`Úkol obnoven (${lostXp > 0 ? `-${lostXp} XP` : '0 XP'}).`, 'info', 'rotate-ccw');

                if (supabaseClient && currentUser) {
                    Promise.all([
                        supabaseClient.from('tasks').update({
                            completed: false,
                            completed_at: null,
                            earned_xp: 0
                        }).eq('id', task.id).eq('user_id', currentUser.id),
                        syncProfileStatsToCloud()
                    ]).catch(err => console.error('Chyba při obnovení úkolu:', err));
                }

                renderTasks(null, task.id);
            }
        };

        // -------------------------------------------------------------
        // SUBTASKS ON EXISTING TASK CARDS
        // -------------------------------------------------------------
        window.toggleSubtask = async function(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            const subtask = task.subtasks.find(st => st.id === subtaskId);
            if (!subtask) return;

            subtask.completed = !subtask.completed;

            // Update progress bar smoothly before re-rendering if all completed
            const completedCount = task.subtasks.filter(s => s.completed).length;
            const totalCount = task.subtasks.length;
            const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

            const barFill = document.getElementById(`progressFill_${taskId}`);
            const barLabel = document.getElementById(`progressLabel_${taskId}`);
            if (barFill) barFill.style.width = `${pct}%`;
            if (barLabel) barLabel.textContent = `${completedCount}/${totalCount}`;

            if (supabaseClient && currentUser) {
                supabaseClient
                    .from('subtasks')
                    .update({ completed: subtask.completed })
                    .eq('id', subtask.id)
                    .eq('user_id', currentUser.id)
                    .then(({ error }) => {
                        if (error) console.error('Chyba při úpravě podúkolu:', error);
                    });
            }

            // If all subtasks are now completed and task is active, complete the parent task
            if (!task.completed && totalCount > 0 && completedCount === totalCount) {
                renderTasks();
                setTimeout(() => {
                    window.toggleTaskComplete(taskId, true);
                }, 120);
            } else {
                renderTasks();
            }
        };

        window.addSubtaskToTask = async function(taskId, inputEl) {

            const newSub = {
                id: crypto.randomUUID ? crypto.randomUUID() : `sub_${Date.now()}_${Math.random()}`,

                completed: false

            task.subtasks.push(newSub);
            inputEl.value = '';
            renderTasks();

            if (supabaseClient && currentUser) {
                const { error } = await supabaseClient
                    .from('subtasks')
                    .insert({
                        id: newSub.id,
                        task_id: task.id,
                        user_id: currentUser.id,
                        title: newSub.title,
                        completed: false,
                        position: task.subtasks.length - 1
                    });
                if (error) {
                    console.error('Chyba při přidání podúkolu:', error);
                }
            }
        };

        window.openColorModal = function(taskId) {

            if (!task) return;

            currentTargetTaskForColor = taskId;
            const container = document.getElementById('colorModalSwatches');
            container.innerHTML = colorPalette.map(c => {
                const isSelected = c.hex.toUpperCase() === task.color.toUpperCase();
                return `
                    <button type="button" onclick="window.changeTaskColor('${escapeJsString(c.hex)}')" title="${escapeHtml(c.name)}"
                        class="w-9 h-9 rounded-full transition transform hover:scale-110 flex items-center justify-center ${isSelected ? 'ring-2 ring-offset-2 ring-offset-[#151C2C] ring-indigo-400 scale-110' : 'opacity-85 hover:opacity-100'}"
                        style="background-color: ${escapeHtml(c.hex)};">
                        ${isSelected ? `<i data-lucide="check" class="w-4 h-4 ${c.hex.toUpperCase() === '#FFFFFF' ? 'text-slate-900' : 'text-white'} stroke-[3]"></i>` : ''}
                    </button>
                `;
            }).join('');
            lucide.createIcons();
            document.getElementById('changeColorModal').classList.remove('hidden');
        };

        window.closeColorModal = function() {
            const modal = document.getElementById('changeColorModal');
            if (modal) modal.classList.add('hidden');
            currentTargetTaskForColor = null;
        };

        window.changeTaskColor = async function(hex) {
            if (!currentTargetTaskForColor) return;
            const task = tasks.find(t => t.id === currentTargetTaskForColor);
            const targetId = currentTargetTaskForColor;
            if (task) {
                task.color = hex.toUpperCase();
            }
            window.closeColorModal();
            renderTasks();

            if (supabaseClient && currentUser) {
                supabaseClient
                    .from('tasks')
                    .update({ color: hex.toUpperCase() })
                    .eq('id', targetId)
                    .eq('user_id', currentUser.id)
                    .then(() => {});
            }
        };

        // -------------------------------------------------------------
        // RENDER TASKS LIST
        // -------------------------------------------------------------
        window.renderTasks = function(enterTaskId = null, uncompleteTaskId = null) {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            const searchQuery = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            const filterCat = document.getElementById('filterCategorySelect')?.value || 'Vše';
            const filterUrg = document.getElementById('filterUrgencySelect')?.value || 'Vše';

            const filtered = tasks.filter(t => {
                const matchesSearch = !searchQuery ||
                    t.title.toLowerCase().includes(searchQuery) ||
                    t.subtasks.some(st => st.title.toLowerCase().includes(searchQuery));
                const matchesCat = filterCat === 'Vše' || t.category === filterCat;
                const matchesUrg = filterUrg === 'Vše' || String(t.urgency) === String(filterUrg);
                return matchesSearch && matchesCat && matchesUrg;
            });

            const activeTasks = filtered
                .filter(t => !t.completed)
                .sort((a, b) => {
                    if (b.urgency !== a.urgency) return b.urgency - a.urgency;
                    return (a.dueDate || '').localeCompare(b.dueDate || '');
                });

            const completedTasks = filtered
                .filter(t => t.completed)
                .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

            if (activeTasks.length === 0 && completedTasks.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-10 text-center space-y-2.5 shadow-xl">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto">
                            <i data-lucide="scroll" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-sm font-bold text-slate-200">Žádné úkoly k zobrazení</h3>
                        <p class="text-xs text-slate-400">Vytvoř si nový úkol nahoře nebo uprav nastavené filtry.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = '';

            if (activeTasks.length > 0) {
                html += `
                    <section class="space-y-3">
                        <div class="flex items-center justify-between px-1">
                            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                                <span>Aktivní úkoly (${activeTasks.length})</span>
                            </h2>
                        </div>
                        <div class="space-y-3">
                            ${activeTasks.map(t => renderTaskCardHtml(t, enterTaskId === t.id, uncompleteTaskId === t.id)).join('')}
                        </div>
                    </section>
                `;
            }

            if (completedTasks.length > 0) {
                html += `
                    <section class="space-y-3 pt-2">
                        <div class="flex items-center justify-between px-1">
                            <h2 class="text-xs font-extrabold uppercase tracking-wider text-emerald-400/80 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span>Splněné úkoly (${completedTasks.length})</span>
                            </h2>
                            <span class="text-[11px] text-slate-500">Automaticky se smažou po 24 hodinách</span>
                        </div>
                        <div class="space-y-3">
                            ${completedTasks.map(t => renderTaskCardHtml(t, false, false)).join('')}
                        </div>
                    </section>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        };

        function renderTaskCardHtml(task, isEntering = false, isUncompleting = false) {
            const deadlineStatus = task.completed ? 'normal' : getDeadlineStatus(task.dueDate);
            let glowClass = '';
            if (deadlineStatus === 'overdue') glowClass = 'task-overdue';
            else if (deadlineStatus === 'today') glowClass = 'task-close-deadline';
            else if (deadlineStatus === 'tomorrow') glowClass = 'task-close-deadline-1';
            else if (deadlineStatus === 'two-days') glowClass = 'task-close-deadline-2';

            const animClass = isEntering ? 'task-enter-anim' : (isUncompleting ? 'task-uncomplete-pulse' : '');
            const stars = '★'.repeat(task.urgency) + '<span class="text-slate-700">' + '★'.repeat(5 - task.urgency) + '</span>';

            const totalSubs = task.subtasks.length;
            const doneSubs = task.subtasks.filter(s => s.completed).length;
            const progressPct = totalSubs > 0 ? Math.round((doneSubs / totalSubs) * 100) : 0;

            let dueBadgeClass = 'text-slate-400 bg-[#0B0F17] border-slate-800';
            if (!task.completed) {
                if (deadlineStatus === 'overdue') dueBadgeClass = 'text-rose-400 bg-rose-500/10 border-rose-500/30 font-bold';
                else if (deadlineStatus === 'today' || deadlineStatus === 'tomorrow') dueBadgeClass = 'text-amber-400 bg-amber-500/10 border-amber-500/30 font-semibold';
            }

            return `
                <article data-task-id="${escapeHtml(task.id)}"
                    class="relative overflow-hidden bg-[#151C2C] border border-slate-800/80 rounded-2xl p-4 sm:p-5 shadow-xl transition ${glowClass} ${animClass} ${task.completed ? 'opacity-70' : ''}">
                    
                    <!-- Left Color Strip -->
                    <div class="absolute left-0 top-0 bottom-0 w-1.5" style="background-color: ${escapeHtml(task.color)};"></div>

                    <div class="pl-2 space-y-3.5">
                        <!-- Top Row: Checkbox, Title, Actions -->
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-start space-x-3 min-w-0 flex-1">
                                <button type="button" onclick="window.toggleTaskComplete('${escapeJsString(task.id)}')"
                                    class="mt-0.5 w-5 h-5 rounded-lg border flex items-center justify-center flex-shrink-0 transition ${
                                        task.completed
                                            ? 'bg-emerald-500 border-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30'
                                            : 'bg-[#0B0F17] border-slate-700 hover:border-indigo-400 text-transparent'
                                    }" title="${task.completed ? 'Obnovit úkol' : 'Splnit úkol'}">
                                    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
                                </button>

                                <div class="min-w-0 flex-1 space-y-1.5">
                                    <h3 class="text-sm font-bold leading-snug break-words ${task.completed ? 'line-through text-slate-400' : 'text-white'}">
                                        ${escapeHtml(task.title)}
                                    </h3>

                                    <!-- Metadata Pills -->
                                    <div class="flex flex-wrap items-center gap-2 text-[11px]">
                                        <span class="px-2.5 py-0.5 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 font-semibold">
                                            ${escapeHtml(task.category)}
                                        </span>
                                        <span class="px-2 py-0.5 rounded-lg bg-[#0B0F17] border border-slate-800 text-amber-400 tracking-tight" title="Naléhavost ${task.urgency}/5">
                                            ${stars}
                                        </span>
                                        <span class="px-2.5 py-0.5 rounded-lg border flex items-center gap-1 ${dueBadgeClass}">
                                            <i data-lucide="calendar" class="w-3 h-3"></i>
                                            <span>${escapeHtml(formatDisplayDate(task.dueDate))}</span>
                                        </span>
                                        ${task.completed && task.earnedXp > 0
                                            ? `<span class="px-2 py-0.5 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-emerald-400 font-bold">+${task.earnedXp} XP</span>`
                                            : ''
                                        }
                                    </div>
                                </div>
                            </div>

                            <!-- Card Action Buttons -->
                            <div class="flex items-center space-x-1 flex-shrink-0">
                                <button type="button" onclick="window.openEditTitleModal('task', '${escapeJsString(task.id)}')"
                                    class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-slate-800/80 transition" title="Upravit název úkolu">
                                    <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                </button>
                                <button type="button" onclick="window.openColorModal('${escapeJsString(task.id)}')"
                                    class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-slate-800/80 transition" title="Změnit barvu úkolu">
                                    <i data-lucide="palette" class="w-3.5 h-3.5"></i>
                                </button>
                                <button type="button" onclick="window.deleteTask('${escapeJsString(task.id)}')"
                                    class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition" title="Smazat úkol">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Subtasks Section (Progress Bar + Vertical List + Inline Add) -->
                        ${(totalSubs > 0 || !task.completed) ? `
                            <div class="pt-1 space-y-2.5 border-t border-slate-800/70">
                                ${totalSubs > 0 ? `
                                    <div class="flex items-center space-x-3">
                                        <div class="flex-1 h-1.5 bg-[#0B0F17] rounded-full overflow-hidden border border-slate-800/80">
                                            <div id="progressFill_${escapeHtml(task.id)}"
                                                class="subtask-progress-fill h-full rounded-full ${progressPct === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}"
                                                style="width: ${progressPct}%;"></div>
                                        </div>
                                        <span id="progressLabel_${escapeHtml(task.id)}" class="text-[11px] font-bold text-slate-400 tabular-nums">
                                            ${doneSubs}/${totalSubs}
                                        </span>
                                    </div>

                                    <div class="space-y-1.5">
                                        ${task.subtasks.map(st => `
                                            <div class="flex items-center justify-between bg-[#0B0F17]/80 border border-slate-800/80 rounded-xl px-3 py-2 text-xs group">
                                                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                                                    <button type="button" onclick="window.toggleSubtask('${escapeJsString(task.id)}', '${escapeJsString(st.id)}')"
                                                        class="w-4 h-4 rounded-md border flex items-center justify-center flex-shrink-0 transition ${
                                                            st.completed
                                                                ? 'bg-emerald-500 border-emerald-500 text-slate-950'
                                                                : 'bg-[#151C2C] border-slate-700 hover:border-indigo-400 text-transparent'
                                                        }">
                                                        <i data-lucide="check" class="w-3 h-3 stroke-[3]"></i>
                                                    </button>
                                                    <span class="truncate ${st.completed ? 'line-through text-slate-500' : 'text-slate-200'}">
                                                        ${escapeHtml(st.title)}
                                                    </span>
                                                </div>
                                                <div class="flex items-center space-x-1.5 flex-shrink-0 ml-2">
                                                    <button type="button" onclick="window.openEditTitleModal('subtask', '${escapeJsString(task.id)}', '${escapeJsString(st.id)}')"
                                                        class="text-slate-500 hover:text-indigo-400 transition p-0.5" title="Upravit podúkol">
                                                        <i data-lucide="edit-2" class="w-3 h-3"></i>
                                                    </button>
                                                    <button type="button" onclick="window.deleteSubtask('${escapeJsString(task.id)}', '${escapeJsString(st.id)}')"
                                                        class="text-slate-500 hover:text-rose-400 transition p-0.5" title="Smazat podúkol">
                                                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}

                                ${!task.completed ? `
                                    <div class="flex items-center space-x-2">
                                        <input type="text" placeholder="Přidat další podúkol..."
                                            onkeydown="if(event.key==='Enter'){event.preventDefault();window.addSubtaskToTask('${escapeJsString(task.id)}', this);}"
                                            class="flex-1 bg-[#0B0F17]/60 border border-slate-800/80 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                                        <button type="button" onclick="window.addSubtaskToTask('${escapeJsString(task.id)}', this.previousElementSibling)"
                                            class="px-2.5 py-1.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition flex items-center" title="Přidat podúkol">
                                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </article>
            `;
        }

        // -------------------------------------------------------------
        // CUSTOM CONFIRMATION MODAL & TOAST NOTIFICATIONS
        // -------------------------------------------------------------
        function showConfirmModal(message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                const textEl = document.getElementById('confirmModalText');
                const okBtn = document.getElementById('confirmModalOkBtn');
                const cancelBtn = document.getElementById('confirmModalCancelBtn');

                textEl.textContent = message;
                modal.classList.remove('hidden');

                function cleanup(result) {
                    modal.classList.add('hidden');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    resolve(result);
                }

                function onOk() { cleanup(true); }
                function onCancel() { cleanup(false); }

                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
            });
        }

        function showToast(message, type = 'info', iconName = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const styles = {
                success: 'bg-[#151C2C]/95 border-emerald-500/40 text-emerald-300 shadow-emerald-950/50',
                warning: 'bg-[#151C2C]/95 border-amber-500/40 text-amber-300 shadow-amber-950/50',
                info: 'bg-[#151C2C]/95 border-indigo-500/40 text-indigo-200 shadow-indigo-950/50'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center space-x-2.5 px-4 py-3 rounded-xl border text-xs font-semibold shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${styles[type] || styles.info}`;
            toast.innerHTML = `
                <i data-lucide="${escapeHtml(iconName)}" class="w-4 h-4 flex-shrink-0"></i>
                <span>${escapeHtml(message)}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
