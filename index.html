                return `
                    <button type="button" onclick="window.applyNewTaskColor('${escapeJsString(c.hex)}')" title="${escapeHtml(c.name)}"
                        class="w-9 h-9 rounded-full transition-transform transform hover:scale-110 flex items-center justify-center ${
                            isSelected ? 'ring-2 ring-offset-2 ring-offset-[#151C2C] ring-indigo-400 scale-110' : ''
                        }"
                        style="background-color: ${escapeHtml(c.hex)};">
                        ${isSelected ? `<i data-lucide="check" class="w-4 h-4 ${c.hex.toUpperCase() === '#FFFFFF' ? 'text-slate-900' : 'text-white'}"></i>` : ''}
                    </button>
                `;
            }).join('');

            document.getElementById('changeColorModal').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeColorModal = function() {
            document.getElementById('changeColorModal').classList.add('hidden');
            currentTargetTaskForColor = null;
        };

        window.applyNewTaskColor = function(hex) {
            if (!currentTargetTaskForColor) return;
            const taskId = currentTargetTaskForColor;
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.color = hex;
                renderTasks();
                if (currentUser && supabaseClient) {
                    supabaseClient.from('tasks').update({ color: hex }).eq('id', taskId).then(() => {});
                }
            }
            window.closeColorModal();
        };

        // -------------------------------------------------------------
        // CONFIRMATION MODAL & TOAST NOTIFICATIONS
        // -------------------------------------------------------------
        function openConfirmModal(message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const textEl = document.getElementById('confirmModalText');
            const okBtn = document.getElementById('confirmModalOkBtn');
            const cancelBtn = document.getElementById('confirmModalCancelBtn');

            textEl.textContent = message;
            modal.classList.remove('hidden');

            const cleanup = () => {
                modal.classList.add('hidden');
                okBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            cancelBtn.onclick = cleanup;
            okBtn.onclick = () => {
                cleanup();
                if (typeof onConfirm === 'function') onConfirm();
            };
        }

        function showToast(message, type = 'info', iconName = 'scroll') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const colors = {
                success: 'border-emerald-500/40 bg-[#151C2C]/95 text-emerald-300',
                warning: 'border-amber-500/40 bg-[#151C2C]/95 text-amber-300',
                info: 'border-indigo-500/40 bg-[#151C2C]/95 text-slate-200'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center space-x-2.5 px-4 py-3 rounded-xl border shadow-2xl text-xs font-semibold backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `
                <i data-lucide="${escapeHtml(iconName)}" class="w-4 h-4 flex-shrink-0"></i>
                <span>${escapeHtml(message)}</span>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        // -------------------------------------------------------------
        // DATE HELPERS & TASKS RENDERING
        // -------------------------------------------------------------
        function getDaysDifferenceFromToday(isoDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const [y, m, d] = isoDateStr.split('-').map(Number);
            const target = new Date(y, m - 1, d);
            target.setHours(0, 0, 0, 0);
            return Math.round((target - today) / (1000 * 60 * 60 * 24));
        }

        function formatCzechDateHeader(isoDateStr) {
            const diffDays = getDaysDifferenceFromToday(isoDateStr);
            const [y, m, d] = isoDateStr.split('-').map(Number);
            const monthGenitive = [
                'ledna', 'února', 'března', 'dubna', 'května', 'června',
                'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'
            ];
            const dateFormatted = `${d}. ${monthGenitive[m - 1]} ${y}`;

            if (diffDays === 0) return `Dnes — ${dateFormatted}`;
            if (diffDays === 1) return `Zítra — ${dateFormatted}`;
            if (diffDays === -1) return `Včera — ${dateFormatted}`;
            return dateFormatted;
        }

        function getUrgencyBadgeStyle(urgency) {
            switch (urgency) {
                case 5: return 'bg-rose-500/15 text-rose-300 border-rose-500/30';
                case 4: return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
                case 3: return 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30';
                case 2: return 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30';
                default: return 'bg-slate-800 text-slate-400 border-slate-700';
            }
        }

        window.renderTasks = function(newlyCreatedTaskId = null, progressStartOverrides = {}) {
            const container = document.getElementById('tasksContainer');
            if (!container) return;

            const searchQuery = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            const filterCategory = document.getElementById('filterCategorySelect')?.value || 'Vše';
            const filterUrgency = document.getElementById('filterUrgencySelect')?.value || 'Vše';

            const filteredTasks = tasks.filter(task => {
                const matchesSearch = !searchQuery ||
                    task.title.toLowerCase().includes(searchQuery) ||
                    (Array.isArray(task.subtasks) && task.subtasks.some(st => st.title.toLowerCase().includes(searchQuery)));
                const matchesCat = filterCategory === 'Vše' || task.category === filterCategory;
                const matchesUrg = filterUrgency === 'Vše' || String(task.urgency) === String(filterUrgency);
                return matchesSearch && matchesCat && matchesUrg;
            });

            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-10 text-center space-y-2 shadow-xl">
                        <div class="w-12 h-12 rounded-2xl bg-slate-800/80 text-slate-500 flex items-center justify-center mx-auto mb-2">
                            <i data-lucide="scroll" class="w-6 h-6"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-300">Žádné úkoly k zobrazení</p>
                        <p class="text-xs text-slate-500">Vytvoř nový úkol výše nebo uprav aktivní filtry.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Group tasks by dueDate
            const grouped = {};
            filteredTasks.forEach(task => {
                if (!grouped[task.dueDate]) grouped[task.dueDate] = [];
                grouped[task.dueDate].push(task);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => a.localeCompare(b));

            container.innerHTML = sortedDates.map(dateStr => {
                const dayTasks = grouped[dateStr].slice().sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    return b.urgency - a.urgency;
                });

                const diffDays = getDaysDifferenceFromToday(dateStr);
                const isOverdueHeader = diffDays < 0 && dayTasks.some(t => !t.completed);

                return `
                    <section class="space-y-3">
                        <div class="flex items-center justify-between px-1">
                            <h2 class="text-xs font-extrabold uppercase tracking-wider ${isOverdueHeader ? 'text-rose-400' : 'text-slate-400'} flex items-center space-x-2">
                                <i data-lucide="calendar" class="w-3.5 h-3.5 ${isOverdueHeader ? 'text-rose-400' : 'text-indigo-400'}"></i>
                                <span>${escapeHtml(formatCzechDateHeader(dateStr))}</span>
                            </h2>
                            <span class="text-[11px] font-semibold text-slate-500">${dayTasks.filter(t => t.completed).length} / ${dayTasks.length} hotovo</span>
                        </div>

                        <div class="space-y-3">
                            ${dayTasks.map(task => renderSingleTaskCard(task, newlyCreatedTaskId, progressStartOverrides)).join('')}
                        </div>
                    </section>
                `;
            }).join('');

            lucide.createIcons();

            Object.keys(progressStartOverrides).forEach(tId => {
                const task = tasks.find(t => t.id === tId);
                const card = container.querySelector(`[data-task-id="${tId}"]`);
                if (task && card && Array.isArray(task.subtasks) && task.subtasks.length > 0) {
                    const bar = card.querySelector('.subtask-progress-fill');
                    if (bar) {
                        const targetPct = Math.round((task.subtasks.filter(s => s.completed).length / task.subtasks.length) * 100);
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                bar.style.width = `${targetPct}%`;
                            });
                        });
                    }
                }
            });

            if (newlyCreatedTaskId) {
                setTimeout(() => {
                    const card = container.querySelector(`[data-task-id="${newlyCreatedTaskId}"]`);
                    if (card) card.classList.remove('task-enter-anim');
                }, 500);
            }
        };

        function renderSingleTaskCard(task, newlyCreatedTaskId, progressStartOverrides) {
            const diffDays = getDaysDifferenceFromToday(task.dueDate);
            let glowClass = '';
            let deadlineBadgeHtml = '';

            if (!task.completed) {
                if (diffDays < 0) {
                    glowClass = 'task-overdue';
                    deadlineBadgeHtml = `<span class="px-2 py-0.5 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-300 text-[10px] font-bold">Po termínu</span>`;
                } else if (diffDays === 0) {
                    glowClass = 'task-close-deadline';
                    deadlineBadgeHtml = `<span class="px-2 py-0.5 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[10px] font-bold">Dnes termín</span>`;
                } else if (diffDays === 1) {
                    glowClass = 'task-close-deadline-1';
                    deadlineBadgeHtml = `<span class="px-2 py-0.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-300/80 text-[10px] font-semibold">Zítra</span>`;
                } else if (diffDays === 2) {
                    glowClass = 'task-close-deadline-2';
                }
            }

            const isNew = task.id === newlyCreatedTaskId;
            const hasSubtasks = Array.isArray(task.subtasks) && task.subtasks.length > 0;

            let subtasksHtml = '';
            if (hasSubtasks) {
                const totalSub = task.subtasks.length;
                const doneSub = task.subtasks.filter(s => s.completed).length;
                const targetPct = Math.round((doneSub / totalSub) * 100);
                const initialPct = Object.prototype.hasOwnProperty.call(progressStartOverrides, task.id)
                    ? progressStartOverrides[task.id]
                    : targetPct;

                const sortedSubtasks = task.subtasks.slice().sort((a, b) => {
                    if (a.completed === b.completed) return 0;
                    return a.completed ? 1 : -1;
                });

                subtasksHtml = `
                    <div class="mt-3.5 pt-3.5 border-t border-slate-800/80 space-y-2.5">
                        <div class="flex items-center justify-between text-[11px] font-semibold">
                            <span class="text-slate-400">Podúkoly</span>
                            <span class="${targetPct === 100 ? 'text-emerald-400' : 'text-indigo-300'}">${doneSub} / ${totalSub} (${targetPct}%)</span>
                        </div>
                        <div class="w-full h-1.5 bg-[#0B0F17] rounded-full overflow-hidden border border-slate-800/80">
                            <div class="subtask-progress-fill h-full rounded-full ${targetPct === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}" style="width: ${initialPct}%;"></div>
                        </div>
                        <div class="flex flex-col space-y-1.5 pt-1">
                            ${sortedSubtasks.map(st => `
                                <div class="group/sub flex items-center justify-between bg-[#0B0F17]/75 border border-slate-800/80 rounded-xl px-3 py-2 text-xs transition ${st.completed ? 'opacity-60' : 'hover:border-slate-700'}">
                                    <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                                        <button type="button" onclick="window.toggleSubtaskComplete('${escapeJsString(task.id)}', '${escapeJsString(st.id)}')"
                                            class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${
                                                st.completed
                                                    ? 'bg-emerald-500 border-emerald-500 text-slate-950'
                                                    : 'border-slate-600 hover:border-indigo-400 text-transparent'
                                            } ${task.completed ? 'cursor-not-allowed' : 'cursor-pointer'}">
                                            <i data-lucide="check" class="w-3 h-3 stroke-[3]"></i>
                                        </button>
                                        <span class="truncate ${st.completed ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}">${escapeHtml(st.title)}</span>
                                    </div>
                                    ${!task.completed ? `
                                        <button type="button" onclick="window.openEditTitleModal('subtask', '${escapeJsString(task.id)}', '${escapeJsString(st.id)}')" title="Upravit název podúkolu"
                                            class="opacity-0 group-hover/sub:opacity-100 text-slate-500 hover:text-indigo-400 transition ml-2 flex-shrink-0">
                                            <i data-lucide="edit-2" class="w-3 h-3"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <article data-task-id="${escapeHtml(task.id)}"
                    class="group bg-[#151C2C] border border-slate-800/80 rounded-2xl p-4 sm:p-5 shadow-xl transition-all duration-300 ${glowClass} ${isNew ? 'task-enter-anim' : ''} ${task.completed ? 'opacity-60 bg-[#151C2C]/70' : 'hover:border-slate-700/90'}">
                    <div class="flex items-start justify-between gap-4">
                        <!-- Left: Color Circle + Task Title -->
                        <div class="flex items-center space-x-3.5 min-w-0 flex-1">
                            <button type="button" onclick="window.openColorModal('${escapeJsString(task.id)}')" title="${task.completed ? 'Splněný úkol' : 'Změnit barvu úkolu'}"
                                class="w-4 h-4 rounded-full flex-shrink-0 transition-transform ${task.completed ? 'cursor-default opacity-70' : 'hover:scale-125 cursor-pointer'}"
                                style="background-color: ${escapeHtml(task.color)}; box-shadow: 0 0 10px ${escapeHtml(task.color)}55;">
                            </button>
                            <div class="flex items-center space-x-2 min-w-0">
                                <h3 class="text-base font-bold leading-snug break-words ${task.completed ? 'line-through text-slate-400' : 'text-white'}">
                                    ${escapeHtml(task.title)}
                                </h3>
                                ${!task.completed ? `
                                    <button type="button" onclick="window.openEditTitleModal('task', '${escapeJsString(task.id)}')" title="Upravit název úkolu"
                                        class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-indigo-400 transition flex-shrink-0 p-1">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Right: Badges + Complete Circle + Delete Cross -->
                        <div class="flex items-center space-x-2.5 flex-shrink-0">
                            ${deadlineBadgeHtml}
                            <span class="px-2.5 py-1 rounded-lg bg-slate-800/90 border border-slate-700/70 text-[11px] font-semibold text-slate-300">
                                ${escapeHtml(task.category)}
                            </span>
                            <span class="px-2.5 py-1 rounded-lg border text-[11px] font-bold ${getUrgencyBadgeStyle(task.urgency)}">
                                ★ ${task.urgency}
                            </span>
                            <button type="button" onclick="window.toggleTaskComplete('${escapeJsString(task.id)}')" title="${task.completed ? 'Zrušit splnění' : 'Označit jako splněné'}"
                                class="w-8 h-8 rounded-full border-2 flex items-center justify-center transition transform hover:scale-105 ${
                                    task.completed
                                        ? 'bg-emerald-500 border-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/25'
                                        : 'border-slate-600 hover:border-emerald-400 text-transparent hover:text-emerald-400/50'
                                }">
                                <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
                            </button>
                            <button type="button" onclick="window.requestDeleteTask('${escapeJsString(task.id)}')" title="Smazat úkol"
                                class="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition flex items-center justify-center">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    ${subtasksHtml}
                </article>
            `;
        }
    </script>
</body>
</html>
