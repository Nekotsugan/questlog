<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestLog</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%23151C2C' stroke='%236366F1' stroke-opacity='0.45' stroke-width='1.5'/%3E%3Cg transform='translate(4,4)' fill='none' stroke='%23818CF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='14.5 17.5 3 6 3 3 6 3 17.5 14.5'/%3E%3Cline x1='13' x2='19' y1='19' y2='13'/%3E%3Cline x1='16' x2='20' y1='16' y2='20'/%3E%3Cline x1='19' x2='21' y1='21' y2='19'/%3E%3Cpolyline points='14.5 6.5 18 3 21 3 21 6 17.5 9.5'/%3E%3Cline x1='5' x2='14' y1='14' y2='5'/%3E%3Cline x1='7' x2='17' y1='17' y2='7'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS SDK v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0B0F17',
                        cardBg: '#151C2C',
                        cardBorder: '#1E293B',
                        accent: '#6366F1'
                    }
                }
            }
        };
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: #0B0F17;
            color: #F8FAFC;
        }

        /* Custom Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366F1;
        }

        /* Custom Rounded Dropdown Menus */
        .custom-select-menu {
            scrollbar-width: thin;
            scrollbar-color: #1E293B #0F172A;
        }
        .custom-select-menu::-webkit-scrollbar {
            width: 5px;
        }
        .custom-select-menu::-webkit-scrollbar-track {
            background: #0F172A;
            border-radius: 9999px;
        }
        .custom-select-menu::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 9999px;
        }
        .custom-select-menu::-webkit-scrollbar-thumb:hover {
            background: #6366F1;
        }

        /* Color Swatch Wrapper */
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.75rem;
        }

        /* Deadline Glow Animations */
        @keyframes overdueGlow {
            0%, 100% { border-color: rgba(244, 63, 94, 0.4); box-shadow: 0 0 10px rgba(244, 63, 94, 0.15); }
            50% { border-color: rgba(244, 63, 94, 0.9); box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
        }

        @keyframes closeDeadlineGlow {
            0%, 100% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 10px rgba(245, 158, 11, 0.15); }
            50% { border-color: rgba(245, 158, 11, 0.9); box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
        }

        /* Subtle yellow glow 1 day before deadline */
        @keyframes closeDeadlineGlowDayBefore {
            0%, 100% { border-color: rgba(245, 158, 11, 0.2); box-shadow: 0 0 6px rgba(245, 158, 11, 0.06); }
            50% { border-color: rgba(245, 158, 11, 0.48); box-shadow: 0 0 12px rgba(245, 158, 11, 0.16); }
        }

        /* Barely noticeable yellow glow 2 days before deadline */
        @keyframes closeDeadlineGlowTwoDaysBefore {
            0%, 100% { border-color: rgba(245, 158, 11, 0.08); box-shadow: 0 0 2px rgba(245, 158, 11, 0.02); }
            50% { border-color: rgba(245, 158, 11, 0.22); box-shadow: 0 0 6px rgba(245, 158, 11, 0.07); }
        }

        /* XP Badge Green & Red Flash Animations */
        @keyframes greenGlow {
            0%, 100% {
                box-shadow: 0 0 0px rgba(34, 197, 94, 0);
            }
            40% {
                box-shadow: 0 0 24px rgba(34, 197, 94, 0.65);
                border-color: rgba(34, 197, 94, 0.7);
                background-color: rgba(34, 197, 94, 0.14);
            }
        }

        @keyframes redGlow {
            0%, 100% {
                box-shadow: 0 0 0px rgba(244, 63, 94, 0);
            }
            40% {
                box-shadow: 0 0 24px rgba(244, 63, 94, 0.65);
                border-color: rgba(244, 63, 94, 0.7);
                background-color: rgba(244, 63, 94, 0.14);
            }
        }

        @keyframes greenTextFlash {
            0%, 100% { color: #e0e7ff; }
            35%, 65% { color: #4ade80; }
        }

        @keyframes greenIconFlash {
            0%, 100% {
                color: #818cf8;
                fill: rgba(129, 140, 248, 0.25);
            }
            35%, 65% {
                color: #4ade80;
                fill: rgba(74, 222, 128, 0.32);
            }
        }

        @keyframes redTextFlash {
            0%, 100% { color: #e0e7ff; }
            35%, 65% { color: #fb7185; }
        }

        @keyframes redIconFlash {
            0%, 100% {
                color: #818cf8;
                fill: rgba(129, 140, 248, 0.25);
            }
            35%, 65% {
                color: #fb7185;
                fill: rgba(251, 113, 133, 0.32);
            }
        }

        @keyframes redShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .task-overdue {
            animation: overdueGlow 2.2s infinite ease-in-out;
        }

        .task-close-deadline {
            animation: closeDeadlineGlow 2.2s infinite ease-in-out;
        }

        .task-close-deadline-1 {
            animation: closeDeadlineGlowDayBefore 2.4s infinite ease-in-out;
        }

        .task-close-deadline-2 {
            animation: closeDeadlineGlowTwoDaysBefore 2.6s infinite ease-in-out;
        }

        .animate-green-glow {
            animation: greenGlow 0.55s ease-in-out;
        }

        .animate-green-glow #userXp {
            animation: greenTextFlash 0.55s ease-in-out;
        }

        .animate-green-glow svg {
            animation: greenIconFlash 0.55s ease-in-out;
        }

        .animate-red-shake {
            animation: redShake 0.4s ease-in-out;
        }

        .animate-red-glow-shake {
            animation: redGlow 0.55s ease-in-out, redShake 0.4s ease-in-out;
        }

        .animate-red-glow-shake #userXp {
            animation: redTextFlash 0.55s ease-in-out;
        }

        .animate-red-glow-shake svg {
            animation: redIconFlash 0.55s ease-in-out;
        }

        /* Exponential-like smooth progress bar fill (fast start, gradual slowdown) */
        .subtask-progress-fill {
            transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease;
        }

        /* Task Completion Green Flash (0.5s or 0.9s before gliding down) */
        @keyframes taskCompleteFlash {
            0% {
                border-color: rgba(16, 185, 129, 0.95);
                box-shadow: 0 0 26px rgba(16, 185, 129, 0.55);
                background-color: rgba(16, 185, 129, 0.14);
            }
            55% {
                border-color: rgba(52, 211, 153, 1);
                box-shadow: 0 0 34px rgba(16, 185, 129, 0.65);
                background-color: rgba(16, 185, 129, 0.18);
            }
            100% {
                border-color: rgba(16, 185, 129, 0.55);
                box-shadow: 0 0 14px rgba(16, 185, 129, 0.22);
                background-color: #151C2C;
            }
        }

        .task-complete-flash {
            animation: taskCompleteFlash 0.5s ease-out forwards;
        }

        .task-complete-flash-long {
            animation: taskCompleteFlash 0.9s ease-out forwards;
        }

        /* Task Uncomplete Subtle Wake-up Pulse */
        @keyframes taskUncompletePulse {
            0% {
                border-color: rgba(99, 102, 241, 0.85);
                box-shadow: 0 0 22px rgba(99, 102, 241, 0.4);
            }
            100% {
                border-color: rgba(30, 41, 59, 0.8);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
        }

        .task-uncomplete-pulse {
            animation: taskUncompletePulse 0.65s ease-out;
        }

        /* Task Creation Smooth Entrance */
        @keyframes taskEnterAnim {
            0% {
                opacity: 0;
                transform: translateY(-14px) scale(0.96);
                border-color: rgba(99, 102, 241, 0.85);
                box-shadow: 0 0 26px rgba(99, 102, 241, 0.45);
            }
            70% {
                opacity: 1;
                transform: translateY(2px) scale(1.005);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .task-enter-anim {
            animation: taskEnterAnim 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Task Deletion Smooth Exit */
        .task-exit-anim {
            animation: none !important;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
            opacity: 0 !important;
            transform: translateX(24px) scale(0.95) !important;
            border-color: rgba(244, 63, 94, 0.85) !important;
            pointer-events: none;
        }

        /* Category & Color Item Entrance / Exit Animations */
        @keyframes itemEnterAnim {
            0% {
                opacity: 0;
                transform: translateY(-6px) scale(0.92);
                border-color: rgba(99, 102, 241, 0.85);
                box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .item-enter-anim {
            animation: itemEnterAnim 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .item-exit-anim {
            animation: none !important;
            transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1), transform 0.26s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
            opacity: 0 !important;
            transform: scale(0.88) translateX(10px) !important;
            border-color: rgba(244, 63, 94, 0.85) !important;
            pointer-events: none;
        }

        /* Locked / Blurred Background State Before Login */
        #mainContent {
            transition: filter 0.35s ease, opacity 0.35s ease;
        }

        #mainContent.app-locked {
            filter: blur(5px);
            opacity: 0.55;
            pointer-events: none;
            user-select: none;
        }

        @keyframes authCardAppear {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-card-anim {
            animation: authCardAppear 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-[#0B0F17] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white pb-16">

    <!-- MAIN CONTAINER -->
    <div id="mainContent" class="max-w-5xl mx-auto px-4 py-8 space-y-6 app-locked">
        
        <!-- HEADER WITH XP BADGE & USER ACCOUNT -->
        <header class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-2xl backdrop-blur-md flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3.5">
                <div class="p-3 bg-gradient-to-br from-indigo-500/20 to-violet-500/10 text-indigo-400 rounded-2xl border border-indigo-500/30 shadow-lg shadow-indigo-500/10">
                    <i data-lucide="swords" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        QuestLog
                    </h1>
                </div>
            </div>

            <!-- RIGHT HEADER CONTROLS: XP & USER PROFILE -->
            <div class="flex items-center space-x-2.5 sm:space-x-3">
                <!-- XP STATS BADGE (Grayish-purple theme, numeric only) -->
                <div id="xpBadgeBox" class="flex items-center space-x-2 px-3.5 sm:px-4 py-2 bg-indigo-500/[0.07] border border-indigo-400/15 rounded-xl text-slate-200 font-extrabold text-xs shadow-md transition-transform duration-200 transform hover:scale-105 hover:border-indigo-400/30">
                    <i data-lucide="zap" class="w-4 h-4 text-indigo-400 fill-indigo-400/25"></i>
                    <span id="userXp" class="text-sm tracking-tight text-indigo-100">140</span>
                </div>

                <!-- LOGGED-IN USER PILL + LOGOUT BUTTON -->
                <div id="userAccountBox" class="flex items-center bg-[#0B0F17]/90 border border-slate-800 rounded-xl pl-3 pr-1.5 py-1.5 shadow-md space-x-2">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 rounded-lg bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                            <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        </div>
                        <span id="currentUsernameDisplay" class="text-xs font-bold text-slate-200 max-w-[100px] truncate">Test</span>
                    </div>
                    <div class="h-4 w-px bg-slate-800"></div>
                    <button type="button" onclick="window.logoutUser()" title="Odhlásit se"
                        class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition flex items-center justify-center">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- CREATION PANEL (3 TABS) -->
        <section class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-5">
            <!-- Tabs Header -->
            <div class="flex space-x-2 border-b border-slate-800/80 pb-3">
                <button type="button" id="tabQuestBtn" onclick="window.switchCreationTab('quest')" class="flex items-center space-x-2 px-4 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition">
                    <i data-lucide="scroll" class="w-4 h-4"></i>
                    <span>Nový úkol</span>
                </button>
                <button type="button" id="tabCategoryBtn" onclick="window.switchCreationTab('category')" class="flex items-center space-x-2 px-4 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
                    <i data-lucide="tag" class="w-4 h-4"></i>
                    <span>Nová kategorie</span>
                </button>
                <button type="button" id="tabColorBtn" onclick="window.switchCreationTab('color')" class="flex items-center space-x-2 px-4 py-2 text-xs font-bold rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
                    <i data-lucide="palette" class="w-4 h-4"></i>
                    <span>Nová barva</span>
                </button>
            </div>

            <!-- TAB 1: NOVÝ ÚKOL -->
            <div id="tabQuestContent" class="space-y-4">
                <form id="createQuestForm" onsubmit="window.createNewTask(event)" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <!-- Task Title (Span 2) -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Název úkolu</label>
                            <input type="text" id="taskTitle" required placeholder="Co je potřeba udělat?" oninput="window.clearInputError('taskTitle')" class="w-full bg-[#0B0F17] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                        </div>

                        <!-- Category Selection (Col 3) -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Kategorie</label>
                            <div class="relative custom-select-wrapper" data-select-id="taskCategorySelect">
                                <input type="hidden" id="taskCategorySelect" value="Default">
                                <button type="button" onclick="window.toggleCustomSelect('taskCategorySelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-8 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center justify-between relative">
                                    <span id="taskCategorySelectLabel" class="truncate">Default</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2.5 pointer-events-none transition-transform duration-200" id="taskCategorySelectChevron"></i>
                                </button>
                                <div id="taskCategorySelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>
                        </div>

                        <!-- Urgency Selection (Col 4) -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Naléhavost</label>
                            <div class="relative custom-select-wrapper" data-select-id="taskUrgencySelect">
                                <input type="hidden" id="taskUrgencySelect" value="3">
                                <button type="button" onclick="window.toggleCustomSelect('taskUrgencySelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-8 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center justify-between relative">
                                    <span id="taskUrgencySelectLabel" class="truncate">★ 3 (Normální)</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2.5 pointer-events-none transition-transform duration-200" id="taskUrgencySelectChevron"></i>
                                </button>
                                <div id="taskUrgencySelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Date (Col 1-2, compact) and Color Swatches (Col 3-4) -->
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-start">
                        <!-- Date Selectors (Col 1-2 - Compact & left-aligned) -->
                        <div class="sm:col-span-2 flex items-center space-x-2">
                            <div class="w-[4.75rem] flex-shrink-0">
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Den</label>
                                <div class="relative custom-select-wrapper" data-select-id="taskDaySelect">
                                    <input type="hidden" id="taskDaySelect" value="1">
                                    <button type="button" onclick="window.toggleCustomSelect('taskDaySelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-7 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center relative">
                                        <span id="taskDaySelectLabel" class="truncate text-left">1.</span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2 pointer-events-none transition-transform duration-200" id="taskDaySelectChevron"></i>
                                    </button>
                                    <div id="taskDaySelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                        <!-- Populated dynamically -->
                                    </div>
                                </div>
                            </div>

                            <div class="w-[7.25rem] flex-shrink-0">
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Měsíc</label>
                                <div class="relative custom-select-wrapper" data-select-id="taskMonthSelect">
                                    <input type="hidden" id="taskMonthSelect" value="1">
                                    <button type="button" onclick="window.toggleCustomSelect('taskMonthSelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-7 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center relative">
                                        <span id="taskMonthSelectLabel" class="truncate text-left">Leden</span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2 pointer-events-none transition-transform duration-200" id="taskMonthSelectChevron"></i>
                                    </button>
                                    <div id="taskMonthSelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                        <!-- Populated dynamically -->
                                    </div>
                                </div>
                            </div>

                            <div class="w-[5.5rem] flex-shrink-0">
                                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Rok</label>
                                <div class="relative custom-select-wrapper" data-select-id="taskYearSelect">
                                    <input type="hidden" id="taskYearSelect" value="2026">
                                    <button type="button" onclick="window.toggleCustomSelect('taskYearSelect')" class="w-full bg-[#0B0F17] border border-slate-800 hover:border-slate-700 rounded-xl pl-3 pr-7 py-2.5 text-xs text-white text-left focus:outline-none focus:border-indigo-500 transition cursor-pointer flex items-center relative">
                                        <span id="taskYearSelectLabel" class="truncate text-left">2026</span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-indigo-400 absolute right-2 pointer-events-none transition-transform duration-200" id="taskYearSelectChevron"></i>
                                    </button>
                                    <div id="taskYearSelectMenu" class="custom-select-menu hidden absolute left-0 right-0 mt-1.5 bg-[#0F172A] border border-slate-700/80 rounded-xl shadow-2xl p-1 max-h-48 overflow-y-auto z-40 space-y-0.5">
                                        <!-- Populated dynamically -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Color Swatches (Col 3-4) -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-400 mb-1.5">Barva</label>
                            <div id="colorPaletteSelect" class="flex flex-wrap items-center gap-3 py-2 px-1.5">
                                <!-- Populated dynamically -->

        const SUPABASE_URL = "https://zgnwzwygkfaeazcbwmod.supabase.co/rest/v1/";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YSFOer4K0aug13X_cAgjng_bgnaUX92";

        function isSupabaseConfigured() {
            return (
                typeof SUPABASE_URL === "string" &&
                SUPABASE_URL.startsWith("https://") &&
                !SUPABASE_URL.includes("VLOZ_SVOU") &&
                typeof SUPABASE_PUBLISHABLE_KEY === "string" &&
                SUPABASE_PUBLISHABLE_KEY.length > 20 &&
                !SUPABASE_PUBLISHABLE_KEY.includes("VLOZ_SVUJ")
            );

            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)

        ];

        // -------------------------------------------------------------
        // SAFE ESCAPING, INTERNAL EMAIL & INPUT FEEDBACK HELPERS
        // -------------------------------------------------------------
        function usernameToInternalEmail(username) {
            const bytes = new TextEncoder().encode(username.trim().toLowerCase());
            const hex = Array.from(bytes)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
            return `u_${hex}@questlog.local`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeJsString(str) {
            return String(str)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"');
        }

        window.clearInputError = function(elOrId) {
            const el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
            if (!el) return;
            clearTimeout(el._errorTimeout);
            el.classList.remove('!border-rose-500', 'ring-2', 'ring-rose-500/30', 'animate-red-shake');
        };

        function triggerInputError(elOrId) {
            const el = typeof elOrId === 'string' ? document.getElementById(elOrId) : elOrId;
            if (!el) return;

            el.classList.remove('animate-red-shake');
            void el.offsetWidth;
            el.classList.add('!border-rose-500', 'ring-2', 'ring-rose-500/30', 'animate-red-shake');
            if (typeof el.focus === 'function') {
                el.focus();
            }

            clearTimeout(el._errorTimeout);
            el._errorTimeout = setTimeout(() => {
                el.classList.remove('!border-rose-500', 'ring-2', 'ring-rose-500/30', 'animate-red-shake');
            }, 1600);
        }

        function formatIsoDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

            renderColorsOverview();
            updateXpDisplay(false);
            renderTasks();

            // Periodically remove completed tasks older than 1 day
            setInterval(async () => {
                if (currentUser && await cleanupExpiredCompletedTasks()) {
                    renderTasks();
                }
            }, 60 * 1000);

            // Sync Hex Color Input & Clear Duplicate Highlight
            const colorPicker = document.getElementById('newColorPicker');
            const colorHexText = document.getElementById('newColorHexText');

                colorPicker.addEventListener('input', (e) => {
                    colorHexText.value = e.target.value.toUpperCase();
                    window.clearInputError('newColorHexWrapper');
                });

            // Close custom dropdowns when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.custom-select-wrapper')) {
                    closeAllCustomSelects();
                }
            });

            // Close modals on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeAllCustomSelects();
                    window.closeEditTitleModal();
                    window.closeColorModal();
                    const confirmModal = document.getElementById('confirmModal');
                    if (confirmModal && !confirmModal.classList.contains('hidden')) {
                        confirmModal.classList.add('hidden');
                    }
                }
            });

            // Restore active Supabase session if user is already logged in
            if (supabaseClient) {
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session && session.user) {
                        await loadUserCloudData(session.user);
                    }
                } catch (err) {
                    console.error('Chyba při obnovení relace:', err);
                }
            }
        };

        // -------------------------------------------------------------
        // CLOUD DATA LOADING & AUTHENTICATION LOGIC
        // -------------------------------------------------------------
        async function loadUserCloudData(user) {
            if (!supabaseClient || !user) return;
            currentUser = user;

            try {
                const [
                    { data: profile, error: profileErr },
                    { data: catRows, error: catErr },
                    { data: colorRows, error: colorErr },
                    { data: taskRows, error: taskErr },
                    { data: subtaskRows, error: subtaskErr }
                ] = await Promise.all([
                    supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle(),
                    supabaseClient.from('categories').select('*').eq('user_id', user.id).order('created_at', { ascending: true }),
                    supabaseClient.from('colors').select('*').eq('user_id', user.id).order('created_at', { ascending: true }),
                    supabaseClient.from('tasks').select('*').eq('user_id', user.id).order('created_at', { ascending: true }),
                    supabaseClient.from('subtasks').select('*').eq('user_id', user.id).order('position', { ascending: true }).order('created_at', { ascending: true })
                ]);

                if (profileErr) throw profileErr;
                if (catErr) throw catErr;
                if (colorErr) throw colorErr;
                if (taskErr) throw taskErr;
                if (subtaskErr) throw subtaskErr;

                const todayStr = formatIsoDate(new Date());
                currentUsername = profile?.username || user.user_metadata?.username || 'Hráč';
                userXp = Number(profile?.xp) || 0;

                if (profile?.last_streak_date === todayStr) {
                    dailyStreak = Number(profile?.daily_streak) || 0;
                } else {
                    dailyStreak = 0;
                    if (profile && Number(profile.daily_streak) !== 0) {
                        supabaseClient
                            .from('profiles')
                            .update({ daily_streak: 0 })
                            .eq('id', user.id)
                            .then(() => {});
                    }
                }

                categories = (catRows || []).map(r => r.name);

                const cloudColors = (colorRows || [])
                    .map(r => ({ name: r.name, hex: String(r.hex).toUpperCase() }))
                    .filter(c => !(c.hex === '#FFFFFF' && c.name.toLowerCase() === 'bílá'));

                colorPalette = [
                    { name: "Bílá", hex: "#FFFFFF" },
                    ...cloudColors
                ];
                selectedTaskColor = colorPalette[1]?.hex || "#FFFFFF";

                const subtasksByTask = {};
                (subtaskRows || []).forEach(st => {
                    if (!subtasksByTask[st.task_id]) subtasksByTask[st.task_id] = [];
                    subtasksByTask[st.task_id].push({
                        id: st.id,
                        title: st.title,
                        completed: Boolean(st.completed)
                    });
                });

                tasks = (taskRows || []).map(t => ({
                    id: t.id,
                    title: t.title,
                    category: t.category || 'Default',
                    urgency: Number(t.urgency) || 3,
                    dueDate: t.due_date,
                    color: t.color || '#FFFFFF',
                    completed: Boolean(t.completed),
                    completedAt: t.completed_at ? Number(t.completed_at) : null,
                    earnedXp: Number(t.earned_xp) || 0,
                    countedInStreak: Boolean(t.counted_in_streak),
                    subtasks: subtasksByTask[t.id] || []
                }));

                await cleanupExpiredCompletedTasks();

                document.getElementById('currentUsernameDisplay').textContent = currentUsername;
                renderCategoryDropdowns();
                renderColorPaletteSelector();
                renderCategoriesOverview();
                renderColorsOverview();
                updateXpDisplay(false);
                renderTasks();

                document.getElementById('mainContent').classList.remove('app-locked');
                document.getElementById('authModal').classList.add('hidden');
            } catch (err) {
                console.error('Chyba při načítání dat z databáze:', err);
                showToast('Nepodařilo se načíst data z cloudu.', 'warning', 'alert-triangle');
            }
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const loginErrorMsg = document.getElementById('loginErrorMsg');
            const loginErrorText = loginErrorMsg.querySelector('span');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const submitText = document.getElementById('loginSubmitText');

            if (!supabaseClient) {
                loginErrorText.textContent = 'Doplň nejprve SUPABASE_URL a SUPABASE_PUBLISHABLE_KEY v souboru index.html.';
                loginErrorMsg.classList.remove('hidden');
                return;
            }

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username) {
                triggerInputError(usernameInput);
                return;
            }
            if (!password) {
                triggerInputError(passwordInput);
                return;
            }

            submitBtn.disabled = true;
            submitText.textContent = 'Přihlašuji...';

            try {
                const internalEmail = usernameToInternalEmail(username);
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: internalEmail,
                    password
                });

                if (error || !data?.user) {
                    loginErrorText.textContent = 'Nesprávné přihlašovací jméno nebo heslo.';
                    loginErrorMsg.classList.remove('hidden');
                    triggerInputError(usernameInput);
                    triggerInputError(passwordInput);
                    lucide.createIcons();
                    return;
                }

                loginErrorMsg.classList.add('hidden');
                passwordInput.value = '';
                await loadUserCloudData(data.user);
                showToast(`Vítej zpět, ${currentUsername}!`, 'success', 'user');
            } catch (err) {
                loginErrorText.textContent = 'Chyba při komunikaci se serverem.';
                loginErrorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Přihlásit se';
            }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('regUsername');
            const passwordInput = document.getElementById('regPassword');
            const codeInput = document.getElementById('regInviteCode');
            const statusBox = document.getElementById('registerStatusMsg');
            const statusText = document.getElementById('registerStatusText');
            const submitBtn = document.getElementById('registerSubmitBtn');
            const submitText = document.getElementById('registerSubmitText');

            if (!supabaseClient) {
                statusText.textContent = 'Doplň nejprve SUPABASE_URL a SUPABASE_PUBLISHABLE_KEY v souboru index.html.';
                statusBox.classList.remove('hidden');
                return;
            }

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const inviteCode = codeInput.value.trim();

            if (username.length < 2) {
                triggerInputError(usernameInput);
                statusText.textContent = 'Přihlašovací jméno musí mít alespoň 2 znaky.';
                statusBox.classList.remove('hidden');
                return;
            }
            if (password.length < 6) {
                triggerInputError(passwordInput);
                statusText.textContent = 'Heslo musí mít alespoň 6 znaků.';
                statusBox.classList.remove('hidden');
                return;
            }
            if (!inviteCode) {
                triggerInputError(codeInput);
                statusText.textContent = 'Pro registraci je nutné zadat speciální zvací kód.';
                statusBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitText.textContent = 'Ověřuji kód a vytvářím účet...';

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/register-user`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_PUBLISHABLE_KEY,
                        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
                    },
                    body: JSON.stringify({ username, password, inviteCode })
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok || result.error) {
                    const errMsg = result.error || 'Registrace se nezdařila.';
                    statusText.textContent = errMsg;
                    statusBox.classList.remove('hidden');
                    if (errMsg.toLowerCase().includes('kód')) {
                        triggerInputError(codeInput);
                    } else if (errMsg.toLowerCase().includes('jméno')) {
                        triggerInputError(usernameInput);
                    } else if (errMsg.toLowerCase().includes('heslo')) {
                        triggerInputError(passwordInput);
                    }
                    lucide.createIcons();
                    return;
                }

                // Automatically sign in the newly created user
                const internalEmail = usernameToInternalEmail(username);
                const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: internalEmail,
                    password
                });

                if (signInError || !signInData?.user) {
                    window.switchAuthMode('login');
                    document.getElementById('loginUsername').value = username;
                    showToast('Účet byl vytvořen! Nyní se přihlas.', 'success', 'user-plus');
                    return;
                }

                usernameInput.value = '';
                passwordInput.value = '';
                codeInput.value = '';
                statusBox.classList.add('hidden');

                await loadUserCloudData(signInData.user);
                showToast(`Účet ${currentUsername} byl úspěšně vytvořen!`, 'success', 'user-plus');
            } catch (err) {
                statusText.textContent = 'Nepodařilo se spojit se serverem. Zkus to prosím znovu.';
                statusBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Vytvořit účet';
            }
        };

        function closeAllCustomSelects(exceptId = null) {
            document.querySelectorAll('.custom-select-menu').forEach(menu => {
                const wrapper = menu.closest('.custom-select-wrapper');
                const id = wrapper ? wrapper.dataset.selectId : null;
                if (id !== exceptId) {
                    menu.classList.add('hidden');
                    const chevron = document.getElementById(`${id}Chevron`);
                    if (chevron) chevron.classList.remove('rotate-180');
                }
            });

        window.toggleCustomSelect = function(selectId) {
            const menu = document.getElementById(`${selectId}Menu`);
            const chevron = document.getElementById(`${selectId}Chevron`);
            if (!menu) return;

            const isHidden = menu.classList.contains('hidden');
            closeAllCustomSelects(selectId);

            if (isHidden) {
                menu.classList.remove('hidden');
                if (chevron) chevron.classList.add('rotate-180');
            } else {
                menu.classList.add('hidden');
                if (chevron) chevron.classList.remove('rotate-180');
            }
        };

        function setCustomSelectOptions(selectId, options, selectedValue, onChangeCallback = null) {
            const hiddenInput = document.getElementById(selectId);
            const labelEl = document.getElementById(`${selectId}Label`);
            const menuEl = document.getElementById(`${selectId}Menu`);
            if (!hiddenInput || !labelEl || !menuEl) return;

            const strVal = String(selectedValue);
            hiddenInput.value = strVal;

            const currentObj = options.find(o => String(o.value) === strVal) || options[0];
            if (currentObj) {
                hiddenInput.value = String(currentObj.value);
                labelEl.textContent = currentObj.label;
            }

            menuEl.innerHTML = '';
            options.forEach(opt => {
                const isSelected = String(opt.value) === String(hiddenInput.value);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition flex items-center justify-between ${
                    isSelected
                        ? 'bg-indigo-600 text-white font-semibold'
                        : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                }`;
                btn.innerHTML = `<span class="truncate">${escapeHtml(opt.label)}</span>${isSelected ? '<i data-lucide="check" class="w-3 h-3 flex-shrink-0 ml-1.5"></i>' : ''}`;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    hiddenInput.value = String(opt.value);
                    labelEl.textContent = opt.label;
                    setCustomSelectOptions(selectId, options, opt.value, onChangeCallback);
                    closeAllCustomSelects();
                    if (typeof onChangeCallback === 'function') {
                        onChangeCallback(opt.value);
                    }
                };
                menuEl.appendChild(btn);
            });
            lucide.createIcons();
        }

        function initDateSelects() {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;
            const currentDay = today.getDate();

            const monthNames = [
                'Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen',
                'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'
            ];

            const yearOptions = [];
            for (let y = currentYear - 1; y <= currentYear + 5; y++) {
                yearOptions.push({ value: y, label: String(y) });
            }

            const monthOptions = monthNames.map((name, idx) => ({
                value: idx + 1,
                label: name
            }));

            const updateDaysForMonthYear = (desiredDay) => {
                const m = parseInt(document.getElementById('taskMonthSelect').value, 10) || currentMonth;
                const y = parseInt(document.getElementById('taskYearSelect').value, 10) || currentYear;
                const maxDays = new Date(y, m, 0).getDate();
                const safeDay = Math.min(desiredDay, maxDays);

                const dayOptions = [];
                for (let d = 1; d <= maxDays; d++) {
                    dayOptions.push({ value: d, label: `${d}.` });
                }
                setCustomSelectOptions('taskDaySelect', dayOptions, safeDay);
            };

            setCustomSelectOptions('taskYearSelect', yearOptions, currentYear, () => {
                const prevDay = parseInt(document.getElementById('taskDaySelect').value, 10) || currentDay;
                updateDaysForMonthYear(prevDay);
            });

            setCustomSelectOptions('taskMonthSelect', monthOptions, currentMonth, () => {
                const prevDay = parseInt(document.getElementById('taskDaySelect').value, 10) || currentDay;
                updateDaysForMonthYear(prevDay);
            });

            updateDaysForMonthYear(currentDay);
        }

        // -------------------------------------------------------------
        // AUTO-CLEANUP OF COMPLETED TASKS AFTER 1 DAY
        // -------------------------------------------------------------
        async function cleanupExpiredCompletedTasks() {
            const now = Date.now();
            const expiredIds = [];

            tasks = tasks.filter(task => {
                if (!task.completed) return true;
                const isExpired = typeof task.completedAt === 'number'
                    ? (now - task.completedAt) >= COMPLETED_TASK_TTL_MS
                    : getDaysDifferenceFromToday(task.dueDate) <= -1;

                if (isExpired) {
                    expiredIds.push(task.id);
                    return false;
                }
                return true;
            });

            if (expiredIds.length > 0 && currentUser && supabaseClient) {
                try {
                    await supabaseClient
                        .from('tasks')
                        .delete()
                        .in('id', expiredIds);
                } catch (err) {
                    console.error('Chyba při automatickém mazání starých splněných úkolů:', err);
                }
            }

            return expiredIds.length > 0;
        }

        window.createNewCategory = async function(e) {
            e.preventDefault();
            if (!currentUser || !supabaseClient) return;

            const input = document.getElementById('newCatName');
            const name = input.value.trim();
            if (!name) return;

            const isDuplicate = name.toLowerCase() === 'default' ||
                categories.some(c => c.toLowerCase() === name.toLowerCase());

            if (isDuplicate) {
                triggerInputError(input);
                showToast(`Kategorie "${name}" už existuje.`, 'warning', 'tag');

            categories.push(name);
            input.value = '';
            renderCategoryDropdowns();

            showToast(`Kategorie "${name}" byla přidána.`, 'success', 'tag');

            const { error } = await supabaseClient
                .from('categories')
                .insert({ user_id: currentUser.id, name });

            if (error) {
                console.error('Chyba při ukládání kategorie:', error);
                showToast('Nepodařilo se uložit kategorii do cloudu.', 'warning', 'alert-triangle');
            }

        window.requestDeleteCategory = function(catName) {
            openConfirmModal(`Opravdu chceš smazat kategorii "${catName}"? Úkoly v této kategorii se přesunou do Default.`, () => {
                const itemEl = document.querySelector(`[data-cat-item="${CSS.escape(catName)}"]`);

                t.dueDate === dueDate &&

            );

                triggerInputError(titleInput);
                showToast(`Úkol "${title}" už pro tento den existuje.`, 'warning', 'scroll');
                return;
            }

            const newTaskId = crypto.randomUUID();
            const generatedSubtasks = tempSubtasks.map(stTitle => ({
                id: crypto.randomUUID(),
                title: stTitle,
                completed: false
            }));

                id: newTaskId,
                title,
                category,
                urgency,
                dueDate,
                color: selectedTaskColor,
                completed: false,
                completedAt: null,
                earnedXp: 0,
                countedInStreak: false,
                subtasks: generatedSubtasks
            };

            tasks.push(newTask);
            titleInput.value = '';
            tempSubtasks = [];
            editingTempSubtaskIndex = null;
            renderTempSubtasks();
            renderTasks(newTaskId);
            showToast('Úkol byl přidán.', 'success', 'scroll');

            try {
                const { error: taskInsertErr } = await supabaseClient
                    .from('tasks')
                    .insert({

                        due_date: dueDate,

                        completed: false,
                        completed_at: null,
                        earned_xp: 0,
                        counted_in_streak: false
                    });

                if (generatedSubtasks.length > 0) {
                    const { error: subInsertErr } = await supabaseClient
                        .from('subtasks')
                        .insert(generatedSubtasks.map((st, idx) => ({
                            id: st.id,
                            task_id: newTaskId,
                            user_id: currentUser.id,
                            title: st.title,

                        })));

        // -------------------------------------------------------------
        // XP CALCULATION & SMOOTH COUNTER ANIMATION
        // -------------------------------------------------------------
        function updateXpDisplay(animate = true, isGain = true) {
            const xpEl = document.getElementById('userXp');
            const badgeBox = document.getElementById('xpBadgeBox');
            if (!xpEl || !badgeBox) return;

            if (xpAnimationFrameId) {
                cancelAnimationFrame(xpAnimationFrameId);
                xpAnimationFrameId = null;
            }

            if (!animate) {
                displayedUserXp = userXp;
                xpEl.textContent = String(userXp);
                return;
            }

            // Trigger pure green or red flash
            clearTimeout(xpBadgeAnimTimeout);
            badgeBox.classList.remove('animate-green-glow', 'animate-red-glow-shake');
            void badgeBox.offsetWidth;
            badgeBox.classList.add(isGain ? 'animate-green-glow' : 'animate-red-glow-shake');

            xpBadgeAnimTimeout = setTimeout(() => {
                badgeBox.classList.remove('animate-green-glow', 'animate-red-glow-shake');
            }, 600);

            // Smooth numeric counter transition over 500ms
            const startValue = displayedUserXp;
            const endValue = userXp;
            const duration = 500;
            const startTime = performance.now();

            const step = (now) => {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                displayedUserXp = Math.round(startValue + (endValue - startValue) * eased);
                xpEl.textContent = String(displayedUserXp);

                if (progress < 1) {
                    xpAnimationFrameId = requestAnimationFrame(step);
                } else {
                    displayedUserXp = endValue;
                    xpEl.textContent = String(endValue);
                    xpAnimationFrameId = null;
                }
            };

            xpAnimationFrameId = requestAnimationFrame(step);
        }

        function calculateTaskXpReward(task) {
            const baseXp = 15 + task.urgency * 5;
            const subtaskBonus = Array.isArray(task.subtasks) ? task.subtasks.length * 5 : 0;
            const diffDays = getDaysDifferenceFromToday(task.dueDate);
            const onTime = diffDays >= 0;
            const streakBonus = onTime ? dailyStreak * 10 : 0;
            return {
                total: baseXp + subtaskBonus + streakBonus,
                onTime
            };
        }

        async function syncTaskAndProfileCompletion(task, updateSubtasksState = null) {
            if (!currentUser || !supabaseClient) return;
            const todayStr = formatIsoDate(new Date());

            try {
                const ops = [
                    supabaseClient
                        .from('tasks')
                        .update({
                            completed: task.completed,
                            completed_at: task.completedAt,
                            earned_xp: task.earnedXp,
                            counted_in_streak: task.countedInStreak
                        })
                        .eq('id', task.id),
                    supabaseClient
                        .from('profiles')
                        .update({
                            xp: userXp,
                            daily_streak: dailyStreak,
                            last_streak_date: todayStr
                        })
                        .eq('id', currentUser.id)
                ];

                if (typeof updateSubtasksState === 'boolean' && Array.isArray(task.subtasks) && task.subtasks.length > 0) {
                    ops.push(
                        supabaseClient
                            .from('subtasks')
                            .update({ completed: updateSubtasksState })
                            .eq('task_id', task.id)
                    );
                }

                await Promise.all(ops);
            } catch (err) {
                console.error('Chyba při synchronizaci splnění úkolu:', err);
            }
        }

        // -------------------------------------------------------------
        // FLIP SMOOTH REORDERING & TASK COMPLETION
        // -------------------------------------------------------------
        function captureTaskCardPositions() {
            const map = new Map();
            document.querySelectorAll('[data-task-id]').forEach(el => {
                map.set(el.dataset.taskId, el.getBoundingClientRect());
            });
            return map;
        }

        function playFlipAnimation(oldPositions) {
            document.querySelectorAll('[data-task-id]').forEach(el => {
                const oldRect = oldPositions.get(el.dataset.taskId);
                if (!oldRect) return;
                const newRect = el.getBoundingClientRect();
                const deltaY = oldRect.top - newRect.top;
                const deltaX = oldRect.left - newRect.left;

                if (Math.abs(deltaY) > 1 || Math.abs(deltaX) > 1) {
                    el.style.transition = 'none';
                    el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    void el.offsetWidth;
                    el.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
                    el.style.transform = '';
                    setTimeout(() => {
                        el.style.transition = '';
                    }, 460);
                }
            });
        }

        window.toggleTaskComplete = function(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const cardEl = document.querySelector(`[data-task-id="${taskId}"]`);

            if (!task.completed) {
                const finishCompletion = () => {
                    const oldPositions = captureTaskCardPositions();
                    task.completed = true;
                    task.completedAt = Date.now();
                    if (Array.isArray(task.subtasks)) {
                        task.subtasks.forEach(st => st.completed = true);
                    }

                    const reward = calculateTaskXpReward(task);
                    task.earnedXp = reward.total;
                    if (reward.onTime) {
                        dailyStreak += 1;
                        task.countedInStreak = true;
                    } else {
                        task.countedInStreak = false;
                    }

                    userXp += reward.total;
                    updateXpDisplay(true, true);
                    renderTasks();
                    playFlipAnimation(oldPositions);
                    syncTaskAndProfileCompletion(task, true);
                };

                if (cardEl) {
                    const fillBar = cardEl.querySelector('.subtask-progress-fill');
                    if (fillBar) fillBar.style.width = '100%';

                    cardEl.classList.remove('task-overdue', 'task-close-deadline', 'task-close-deadline-1', 'task-close-deadline-2');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('task-complete-flash');
                    setTimeout(finishCompletion, 500);
                } else {
                    finishCompletion();
                }
            } else {
                const oldPositions = captureTaskCardPositions();
                task.completed = false;
                task.completedAt = null;
                if (Array.isArray(task.subtasks)) {
                    task.subtasks.forEach(st => st.completed = false);
                }

                const deducted = task.earnedXp || 0;
                if (task.countedInStreak && dailyStreak > 0) {
                    dailyStreak -= 1;
                }
                task.earnedXp = 0;
                task.countedInStreak = false;

                userXp = Math.max(0, userXp - deducted);
                updateXpDisplay(true, false);
                renderTasks();
                playFlipAnimation(oldPositions);
                syncTaskAndProfileCompletion(task, false);

                const updatedCard = document.querySelector(`[data-task-id="${taskId}"]`);
                if (updatedCard) {
                    updatedCard.classList.add('task-uncomplete-pulse');
                    setTimeout(() => updatedCard.classList.remove('task-uncomplete-pulse'), 680);
                }
            }
        };

        window.toggleSubtaskComplete = function(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task || !Array.isArray(task.subtasks)) return;

            if (task.completed) {
                showToast('Nejprve odškrtni celý úkol nahoře.', 'info', 'scroll');
                return;
            }

            const subtask = task.subtasks.find(s => s.id === subtaskId);
            if (!subtask) return;

            const totalCount = task.subtasks.length;
            const prevCompletedCount = task.subtasks.filter(s => s.completed).length;
            const prevPercent = totalCount > 0 ? Math.round((prevCompletedCount / totalCount) * 100) : 0;

            subtask.completed = !subtask.completed;

            if (currentUser && supabaseClient) {
                supabaseClient
                    .from('subtasks')
                    .update({ completed: subtask.completed })
                    .eq('id', subtask.id)
                    .then(() => {});
            }

            const newCompletedCount = task.subtasks.filter(s => s.completed).length;

            if (newCompletedCount === totalCount && totalCount > 0) {
                renderTasks(null, { [taskId]: prevPercent });
                const cardEl = document.querySelector(`[data-task-id="${taskId}"]`);
                if (cardEl) {
                    cardEl.classList.remove('task-overdue', 'task-close-deadline', 'task-close-deadline-1', 'task-close-deadline-2');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('task-complete-flash-long');
                }

                setTimeout(() => {
                    const oldPositions = captureTaskCardPositions();
                    task.completed = true;
                    task.completedAt = Date.now();

                    const reward = calculateTaskXpReward(task);
                    task.earnedXp = reward.total;
                    if (reward.onTime) {
                        dailyStreak += 1;
                        task.countedInStreak = true;
                    } else {
                        task.countedInStreak = false;
                    }

                    userXp += reward.total;
                    updateXpDisplay(true, true);
                    renderTasks();
                    playFlipAnimation(oldPositions);
                    syncTaskAndProfileCompletion(task, null);
                }, 900);
            } else {
                renderTasks(null, { [taskId]: prevPercent });
            }
        };
